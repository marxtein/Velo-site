<style>
:root {
  --bg: #faf9f6;
  --surface: #fff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --accent: oklch(0.54 0.21 26);
  --link: oklch(0.42 0.18 24);
  --border: oklch(0.88 0.01 90);
  --tag-bg: oklch(0.94 0.03 80);
  --tag-tx: oklch(0.35 0.06 26);
  --shadow: 0 1px 3px oklch(0 0 0 / 0.04), 0 1px 2px oklch(0 0 0 / 0.06);
  --shadow-h: 0 4px 12px oklch(0 0 0 / 0.08);
}

*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  --webkit-font-smoothing:antialiased;
}

/* Typography */
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;letter-spacing:-0.01em}
h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700}
h3{font-size:1.05rem;font-weight:600}
h4{font-size:0.92rem;font-weight:600}

/* Layout */
header{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:0 1.2rem; position:sticky; top:0; z-index:100;
  backdrop-filter:blur(12px); background:oklch(1 0 0 / 0.92);
}
.header-inner{
  max-width:1280px; margin:0 auto; display:flex; align-items:center;
  gap:2rem; height:56px;
}
.logo{font-family:Georgia,serif; font-size:1.25rem; font-weight:700;
  color:var(--accent); white-space:nowrap; letter-spacing:-0.02em}
.logo span{color:var(--muted);font-weight:400;font-size:0.85rem;margin-left:.5em}
nav{display:flex; gap:1.5rem; flex:1}
nav a{color:var(--muted); text-decoration:none; font-size:0.88rem;
  font-weight:500; transition:color 0.2s; padding:4px 0; border-bottom:2px solid transparent}
nav a:hover,nav a.active{color:var(--text); border-bottom-color:var(--accent)}
.search-bar{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:6px 14px; font-size:0.85rem; width:220px; outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.search-bar:focus{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.54 0.21 26 / 0.1)}

main{max-width:1280px; margin:0 auto; padding:1.5rem 1.2rem}

/* Hero */
.hero{padding:2.5rem 0 1.5rem}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem); line-height:1.2; margin-bottom:.5rem}
.hero p{color:var(--muted); max-width:600px; font-size:1rem}

/* Stats row */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem;
  margin-bottom:2rem}
.stat-card{background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:1.2rem; box-shadow:var(--shadow)}
.stat-card .num{font-family:Georgia,serif; font-size:clamp(1.6rem,3vw,2.2rem);
  font-weight:700; color:var(--accent)}
.stat-card .lbl{font-size:0.82rem; color:var(--muted); margin-top:2px}

/* Section */
.section{margin-bottom:2.5rem}
.section h2{margin-bottom:0.3rem}
.section .sub{color:var(--muted); font-size:0.9rem; margin-bottom:1.2rem}

/* Tags */
.tags{display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1.2rem}
.tag{padding:0.25rem 0.7rem; border-radius:100px; font-size:0.78rem;
  background:var(--tag-bg); color:var(--tag-tx); cursor:pointer;
  transition:all 0.2s; border:1px solid transparent; font-weight:500}
.tag:hover,.tag.sel{background:var(--accent); color:#fff;
  border-color:var(--accent)}

/* Cards grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:1rem}
.card{background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:1.2rem; box-shadow:var(--shadow);
  transition:box-shadow 0.2s, transform 0.15s; cursor:pointer}
.card:hover{box-shadow:var(--shadow-h); transform:translateY(-1px)}
.card-top{display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:0.5rem}
.card-title{font-family:Georgia,serif; font-size:1rem; font-weight:700}
.card-route{
  font-size:0.72rem; background:var(--accent); color:#fff;
  padding:2px 8px; border-radius:4px; font-weight:600; white-space:nowrap}
.card-route.tokamak{background:oklch(0.48 0.15 26)}
.card-route.stellarator{background:oklch(0.42 0.15 24)}
.card-route.frc{background:oklch(0.5 0.12 20)}
.card-route.icf{background:oklch(0.44 0.1 28)}
.card-route.other{background:var(--muted)}
.card-info{font-size:0.82rem; color:var(--muted); line-height:1.5}
.card-info span{display:inline-block; margin-right:1rem}
.card-stats{display:flex; gap:0.8rem; margin-top:0.6rem; padding-top:0.6rem;
  border-top:1px solid var(--border); font-size:0.78rem; color:var(--muted)}
.card-stats strong{color:var(--text)}

/* Company card */
.comp-card .card-route{background:oklch(0.46 0.09 24)}
.comp-card .card-meta{font-size:0.78rem; color:var(--muted); margin-top:.4rem}

/* Empty */
.empty{text-align:center; padding:3rem; color:var(--muted)}
@media (max-width:640px){
  .header-inner{flex-wrap:wrap; height:auto; padding:0.5rem 0; gap:0.5rem}
  nav{overflow-x:auto; gap:0.8rem}
  .grid{grid-template-columns:1fr}
  .search-bar{width:100%}
}
</style>
</head>

   desc:"中央直接管理的特大型国有骨干企业，完整的核科技工业体系，资产规模约1.4万亿元。",
   val:"~14万亿",ppl:"~18万人",yr:"1999",web:"https://www.cnnc.com.cn",
   r:"核能开发利用 / 聚变工程"},
  {n:"西物院",a:"SWIP",loc:"中国成都",type:"国央企",
   desc:"中国磁约束聚变发源地，运营HL-2M、中国环流三号，托卡马克参数世界领先。",
   val:"",ppl:"~2000人",yr:"1965",web:"https://www.swip.ac.cn",
   r:"托卡马克物理 / 聚变堆设计"},
];

const PAPERS = [
  {n:"ITER Physics Basis",a:"ITER Team",y:"1999",j:"Nuclear Fusion",h:"ITER物理设计基础文献，定义了ITER的等离子体参数和运行模式"},
  {n:"A new path to fusion energy",a:"M. Greenwald",y:"2016",j:"MIT/CFS Report",h:"提出ARC概念——利用REBCO高温超导磁体实现紧凑型聚变堆"},
  {n:"Direct construction of optimized stellarator shapes (Part 1 & 2)",a:"M. Landreman, W. Sengupta",y:"2019",j:"J. Plasma Phys.",h:"近轴展开方法直接构造优化仿星器位形；二阶形状描述bean/crescent截面"},
  {n:"First D-T fusion with a private-sector device",a:"Helion Energy",y:"2026",j:"Helion Press",h:"民间首次可测量D-T聚变反应；等离子体温度达1.5亿℃"},
  {n:"EAST 1066-second steady-state H-mode",a:"ASIPP Team",y:"2025",j:"Physical Review Letters",h:"EAST实现1亿℃、1066秒稳态高约束运行，突破世界纪录"},
  {n:"NIF achieves ignition (Q=1.54)",a:"LLNL Team",y:"2022",j:"Physical Review Letters",h:"首次实验室实现可控核聚变点火，输入2.05MJ输出3.15MJ"},
  {n:"High-beta long-pulse KSTAR operation",a:"KSTAR Team",y:"2025",j:"Nuclear Fusion",h:"KSTAR实现100秒高β长脉冲运行；完成钨偏滤器升级"},
];

const FUNDING = [
  {n:"CFS",ev:"完成I轮融资",amt:"20亿美元",yr:"2025",note:"全球聚变最大单笔融资"},
  {n:"Helion Energy",ev:"完成F轮融资",amt:"4.25亿美元",yr:"2025",note:"与微软签署50MW购电协议"},
  {n:"Type One Energy",ev:"完成融资",amt:"5.34亿美元",yr:"2025",note:"仿星器路线最大融资"},
  {n:"能量奇点",ev:"完成融资",amt:"数亿元",yr:"2025",note:"国内HTS托卡马克领导者"},
  {n:"瞬原科技",ev:"种子轮",amt:"数千万元",yr:"2026",note:"聚变模拟器及先进路线设计"},
  {n:"Zap Energy",ev:"完成E轮融资",amt:"1.3亿美元",yr:"2025",note:"Z-pinch路线"},

];

// --- Render ---
const routeColors = {托卡马克:'tokamak',仿星器:'stellarator',FRC:'frc',惯性约束:'icf',磁惯性:'other'};
function routeClass(r){
  for(const[k,v] of Object.entries(routeColors)) if(r.includes(k)) return v;
  return 'other';
}

function fmtCurrency(v){
  if(!v) return '';
  if(v.includes('亿')) return v;
  return v;
}

function renderStats(){
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${DEVICES.length}</div><div class="lbl">收录装置</div></div>
    <div class="stat-card"><div class="num">${COMPANIES.length}</div><div class="lbl">聚变企业</div></div>
    <div class="stat-card"><div class="num">${PAPERS.length}</div><div class="lbl">关键文献</div></div>
    <div class="stat-card"><div class="num">${FUNDING.length}</div><div class="lbl">融资事件</div></div>
  `;
}

let activeRoute = null;

function renderDeviceTags(){
  const routes = [...new Set(DEVICES.map(d=>d.r))];
  const tagHtml = routes.map(r=>`<span class="tag${activeRoute===r?' sel':''}" onclick="filterByRoute('${r}')">${r}</span>`).join('');
  document.getElementById('deviceTags').innerHTML = tagHtml;
  document.getElementById('deviceCount').textContent = DEVICES.length;
}

function filterByRoute(r){
  activeRoute = activeRoute===r ? null : r;
  renderDeviceTags();
  renderDevices();
}

function renderDevices(filter=''){
  const devs = DEVICES.filter(d=>{
    const m = (d.n+d.r+d.loc+d.h+d.t).toLowerCase().includes(filter.toLowerCase());
    if(activeRoute && !d.r.includes(activeRoute)) return false;
    return m;
  });
  document.getElementById('deviceCount').textContent = devs.length;
  document.getElementById('deviceGrid').innerHTML = devs.length ? devs.map(d=>`
    <div class="card" onclick="">
      <div class="card-top">
        <span class="card-title">${d.n}</span>
        <span class="card-route ${routeClass(d.r)}">${d.t||d.r}</span>
      </div>
      <div class="card-info">
        <span>📍 ${d.loc}</span>
        <span>⚡ ${d.q}</span>
      </div>
      <div class="card-info" style="margin-top:4px">📐 ${d.R}</div>
      <div class="card-stats">
        <span>💰 <strong>${fmtCurrency(d.k)}</strong></span>
      </div>
      <div class="card-info" style="margin-top:6px;font-size:0.8rem">${d.h.slice(0,90)}…</div>
    </div>
  `).join('') : '<div class="empty">没有匹配的装置</div>';
}

function renderCompanies(filter=''){
  const comps = COMPANIES.filter(c=>
    (c.n+c.desc+c.r+c.loc).toLowerCase().includes(filter.toLowerCase())
  );
  document.getElementById('compGrid').innerHTML = comps.map(c=>`
    <div class="card comp-card">
      <div class="card-top">
        <span class="card-title">${c.n}</span>
        <span class="card-route">${c.r.slice(0,12)}${c.r.length>12?'…':''}</span>
      </div>
      <div class="card-info">${c.desc.slice(0,100)}…</div>
      <div class="card-meta">
        📍 ${c.loc} · 👥 ${c.ppl} · 🏢 ${c.type}
        ${c.val?` · 💰 ${c.val}`:''}
      </div>
      ${c.web?`<div class="card-meta" style="margin-top:2px"><a href="${c.web}" target="_blank" style="color:var(--link)">${c.web}</a></div>`:''}
    </div>
  `).join('');
}

function renderPapers(){
  document.getElementById('paperGrid').innerHTML = PAPERS.map(p=>`
    <div class="card">
      <div class="card-top"><span class="card-title">${p.n}</span></div>
      <div class="card-info">👤 ${p.a} · 📅 ${p.y} · 📰 ${p.j}</div>
      <div class="card-info" style="margin-top:4px;font-size:0.8rem">${p.h.slice(0,120)}</div>
    </div>
  `).join('');
}

function renderFunding(){
  document.getElementById('fundingGrid').innerHTML = FUNDING.map(f=>`
    <div class="card">
      <div class="card-top">
        <span class="card-title">${f.n}</span>
        <span class="card-route tokamak">${f.ev}</span>
      </div>
      <div class="card-info">
        <span>💰 ${f.amt}</span><span>📅 ${f.yr}</span>
      </div>
      <div class="card-info" style="margin-top:4px;font-size:0.8rem">${f.note}</div>
    </div>
  `).join('');
}

function filterCards(){
  const q = document.getElementById('searchInput').value;
  if(currentTab==='devices') renderDevices(q);
  else if(currentTab==='companies') renderCompanies(q);
}

let currentTab='devices';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById(tab).style.display='block';
  document.querySelector(`nav a[href="#${tab}"]`).classList.add('active');
  if(tab==='companies') renderCompanies();
  if(tab==='papers') renderPapers();
  if(tab==='funding') renderFunding();
}

// Init
renderStats();
renderDeviceTags();
renderDevices();
renderCompanies();
renderPapers();
renderFunding();
</script>
</body>
</html>
