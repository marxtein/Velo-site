<style>
:root{--bg:#f8f7f4;--surf:#fff;--txt:#1c1c1c;--mu:#5c5c5c;--ac:oklch(0.52 0.18 25);--bd:oklch(0.86 0.01 90);--tg:oklch(0.95 0.02 90);--sh:0 1px 2px oklch(0 0 0/0.04);--shH:0 6px 20px oklch(0 0 0/0.06)}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Georgia,serif;letter-spacing:-0.015em}
h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:700;line-height:1.15}
h2{font-size:clamp(1.2rem,2.5vw,1.6rem);font-weight:700}
header{position:sticky;top:0;z-index:100;background:oklch(1 0 0/0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hi{max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;height:54px;padding:0 1.2rem}
.logo{font-family:Georgia,serif;font-size:1.15rem;font-weight:700;color:var(--ac);white-space:nowrap;text-decoration:none}
.logo span{color:var(--mu);font-weight:400;font-size:.78rem;margin-left:.4em}
nav{display:flex;gap:1rem;flex:1}
nav a{color:var(--mu);text-decoration:none;font-size:.84rem;font-weight:500;padding:3px 0;border-bottom:2px solid transparent;transition:.15s;cursor:pointer}
nav a:hover,nav a.sel{color:var(--txt);border-color:var(--ac)}
.sr{position:relative;flex:0 0 260px}
.sr input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 14px;font-size:.83rem;outline:none;transition:.15s}
.sr input:focus{border-color:var(--ac);box-shadow:0 0 0 3px oklch(0.52 0.18 25/0.08)}
main{max-width:1340px;margin:0 auto;padding:1.2rem 1.2rem 3rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1.5rem}
.sti{text-align:center;padding:.7rem .4rem;background:var(--surf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh)}
.sti .n{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;color:var(--ac)}
.sti .l{font-size:.72rem;color:var(--mu);margin-top:2px}
.tb{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;align-items:center}
.tb .gr{display:flex;flex-wrap:wrap;gap:.3rem}
.tb .lb{font-size:.73rem;color:var(--mu);font-weight:600;margin-right:.2rem;align-self:center}
.tb .tag{padding:.22rem .55rem;border-radius:100px;font-size:.72rem;background:var(--tg);color:var(--mu);cursor:pointer;border:1px solid transparent;transition:.15s;font-weight:500}
.tb .tag:hover,.tb .tag.on{background:var(--ac);color:#fff}
.tb .cnt{font-size:.78rem;color:var(--mu);margin-left:auto}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:.7rem}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:11px;padding:.9rem 1rem;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;gap:.45rem}
.card:hover{box-shadow:var(--shH)}
.card .hd{display:flex;align-items:flex-start;gap:.5rem}
.card .ic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.ic1{background:oklch(0.9 0.05 25);color:oklch(0.38 0.15 26)}.ic2{background:oklch(0.88 0.06 22);color:oklch(0.35 0.13 23)}.ic3{background:oklch(0.85 0.06 27);color:oklch(0.3 0.12 25)}.ic4{background:oklch(0.83 0.07 24);color:oklch(0.28 0.14 24)}.ic5{background:oklch(0.82 0.05 28);color:oklch(0.27 0.10 27)}
.card .tl{font-family:Georgia,serif;font-size:.98rem;font-weight:700;line-height:1.2}
.card .me{font-size:.76rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:.1rem .7rem}
.card .lc{font-size:.7rem;padding:1px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.lo{background:oklch(0.87 0.08 18);color:#0d7a3e}.lc2{background:oklch(0.86 0.06 16);color:#b23b1e}
.card .ds{font-size:.8rem;color:var(--mu);line-height:1.42}
.card .tgs{display:flex;flex-wrap:wrap;gap:.2rem}
.card .tgs span{font-size:.68rem;padding:1px 5px;border-radius:100px;background:var(--tg);color:var(--mu)}
.card .ft{display:flex;align-items:center;gap:.4rem;margin-top:auto;padding-top:.35rem;border-top:1px solid var(--bd);flex-wrap:wrap}
.card .ft a{color:var(--ac);font-size:.76rem;text-decoration:none;font-weight:500}
.card .ft a:hover{text-decoration:underline}
.card .ft .pl{font-size:.72rem;color:var(--mu)}
.dc .rt{font-size:.7rem;padding:1px 7px;border-radius:4px;font-weight:600;color:#fff}
.rt-t{background:oklch(0.44 0.13 26)}.rt-s{background:oklch(0.4 0.11 22)}.rt-f{background:oklch(0.46 0.1 20)}.rt-i{background:oklch(0.42 0.08 28)}.rt-o{background:var(--mu)}
.cc .rtt{font-size:.7rem;padding:1px 7px;border-radius:4px;font-weight:600;color:#fff;background:oklch(0.42 0.09 24)}
.section{display:none}.section.active{display:block}
@media(max-width:700px){.hi{flex-wrap:wrap;height:auto;padding:.4rem .7rem;gap:.5rem}nav{order:3;overflow-x:auto;width:100%}.sr{flex:1;min-width:0}.gd{grid-template-columns:1fr}.st{grid-template-columns:repeat(2,1fr)}.tb{flex-direction:column;align-items:flex-start}.tb .cnt{margin-left:0}}
</style>
</head>

{n:"Tokamak Energy",ev:"融资轮",amt:"1.25亿美元",y:"2024",h:"用于商业化聚变与HTS磁体技术",o:"Tokamak Energy"},
{n:"General Fusion",ev:"过桥融资",amt:"2200万美元",y:"2025",h:"用于支持LM26示范项目",o:"General Fusion"},
{n:"Proxima Fusion",ev:"A轮",amt:"1.3亿欧元",y:"2025",h:"欧洲最大私营聚变投资轮之一，总资金超1.85亿欧元",o:"Proxima"},
{n:"Antom Fusion",ev:"首轮",amt:"近亿元",y:"2025",h:"国内首家Z箍缩聚变商业化团队完成首轮融资",o:"安东聚变"},
{n:"HHMax",ev:"天使轮",amt:"数千万",y:"2025",h:"中国首台商业化FRC装置完成天使轮融资",o:"瀚海聚能"},
{n:"Energy Singularity",ev:"融资轮",amt:"数亿元",y:"2025",h:"国内HTS托卡马克领导者，洪荒70已实现1337秒长脉冲",o:"能量奇点"},
];

// ===== RENDER =====
let curTab='codes',curDom='all',curLic='all',curRoute='all';
function getDom(c){if(c.p.includes('湍流')||c.p.includes('回旋'))return'湍流输运';if(c.p.includes('MHD')&&(c.p.includes('平衡')||c.p.includes('稳定')))return'MHD平衡/稳定';if(c.p.includes('边界')||c.p.includes('偏滤器')||c.p.includes('SOL'))return'边界/偏滤器';if(c.p.includes('仿星'))return'仿星器优化';if(c.p.includes('集成')||c.p.includes('数据标准'))return'集成建模';if(c.p.includes('PIC')||c.p.includes('激光'))return'粒子模拟';if(c.p.includes('反应堆')||c.p.includes('系统代码'))return'反应堆工程';if(c.p.includes('中子')||c.p.includes('材料')||c.p.includes('活化'))return'中子学/材料';if(c.p.includes('诊断'))return'诊断';if(c.p.includes('加热'))return'加热/电流驱动';if(c.p.includes('控制'))return'控制/实时';return'其他'}
const DOMS=['湍流输运','MHD平衡/稳定','边界/偏滤器','仿星器优化','集成建模','粒子模拟','反应堆工程','中子学/材料','加热/电流驱动','控制/实时','诊断','其他'];
const ROUTES=['托卡马克','仿星器','FRC','惯性约束','球形托卡马克','Z箍缩','磁惯性','反向场箍缩'];

function renderCodes(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const flt=C.filter(c=>{if(curDom!=='all'&&getDom(c)!==curDom)return 0;if(curLic==='open'&&!c.o)return 0;if(curLic==='closed'&&c.o)return 0;if(q){const s=(c.n+' '+c.d+' '+c.tm+' '+c.inst+' '+c.p+' '+c.t.join(' ')).toLowerCase();if(!s.includes(q))return 0;}return 1});
  document.getElementById('statsC').innerHTML=`<div class="sti"><div class="n">${C.length}</div><div class="l">收录代码</div></div><div class="sti"><div class="n">${C.filter(c=>c.o).length}</div><div class="l">开源</div></div><div class="sti"><div class="n">${C.filter(c=>!c.o).length}</div><div class="l">闭源/需申请</div></div><div class="sti"><div class="n">${DOMS.length}</div><div class="l">物理领域</div></div>`;
  document.getElementById('tbC').innerHTML=`<span class="lb">领域</span><div class="gr"><span class="tag${curDom==='all'?' on':''}" onclick="setDom('all')">全部</span>${DOMS.map(d=>`<span class="tag${curDom===d?' on':''}" onclick="setDom('${d}')">${d}</span>`).join('')}</div><span class="lb" style="margin-left:.6rem">许可</span><div class="gr"><span class="tag${curLic==='all'?' on':''}" onclick="setLic('all')">全部</span><span class="tag${curLic==='open'?' on':''}" onclick="setLic('open')">开源</span><span class="tag${curLic==='closed'?' on':''}" onclick="setLic('closed')">需申请</span></div><span class="cnt">匹配 ${flt.length} 个</span>`;
  document.getElementById('gdC').innerHTML=flt.map(c=>`<div class="card"><div class="hd"><div class="ic ic1">${c.n[0]}</div><div><div class="tl">${c.n}</div><div class="me">${c.p}</div></div><span class="lc ${c.o?'lo':'lc2'}" style="margin-left:auto">${c.o?'开源':'需申请'}</span></div><div class="ds">${c.d}</div><div class="tgs">${(c.t||[]).slice(0,4).map(t=>`<span>${t}</span>`).join('')}</div><div class="ft">👤 ${c.tm} · 🏛 ${c.inst}${c.pp?` · 📄 ${c.pp}篇论文`:''}<span style="margin-left:auto"></span><a href="${c.url}" target="_blank">GitHub / 主页 →</a></div></div>`).join('')||'<div style="text-align:center;padding:3rem;color:var(--mu);grid-column:1/-1">没有匹配</div>';
}

function renderDevices(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const flt=D.filter(d=>{if(curRoute!=='all'&&d.r!==curRoute)return 0;if(q&&!(d.n+d.r+d.loc+d.h).toLowerCase().includes(q))return 0;return 1});
  document.getElementById('statsD').innerHTML=`<div class="sti"><div class="n">${D.length}</div><div class="l">收录装置</div></div><div class="sti"><div class="n">${[...new Set(D.map(d=>d.r))].length}</div><div class="l">技术路线</div></div><div class="sti"><div class="n">${[...new Set(D.map(d=>d.loc.split('/')[0]))].length}</div><div class="l">国家/地区</div></div><div class="sti"><div class="n">${D.length}</div><div class="l">收录数量</div></div>`;
  document.getElementById('tbD').innerHTML=`<span class="lb">路线</span><div class="gr"><span class="tag${curRoute==='all'?' on':''}" onclick="setRoute('all')">全部</span>${ROUTES.map(r=>`<span class="tag${curRoute===r?' on':''}" onclick="setRoute('${r}')">${r}</span>`).join('')}</div><span class="cnt">匹配 ${flt.length} 台</span>`;
  document.getElementById('gdD').innerHTML=flt.map(d=>`<div class="card dc"><div class="hd"><div class="ic ic2">${d.n[0]}</div><div><div class="tl">${d.n}</div><div class="me">📍 ${d.loc} · ⚡ ${d.q}</div></div><span class="rt ${d.rt||'rt-o'}" style="margin-left:auto">${d.r}</span></div><div class="ds">📐 ${d.s}</div><div class="ds" style="font-size:.76rem">${d.h}</div><div class="ft">💰 ${d.f}${d.w?` · <a href="${d.w}" target="_blank">官网 →</a>`:''}</div></div>`).join('')||'<div style="text-align:center;padding:3rem;color:var(--mu);grid-column:1/-1">没有匹配</div>';
}

function renderCompanies(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const flt=M.filter(m=>{if(q&&!(m.n+m.d+m.r+m.loc).toLowerCase().includes(q))return 0;return 1});
  document.getElementById('statsM').innerHTML=`<div class="sti"><div class="n">${M.length}</div><div class="l">收录企业</div></div><div class="sti"><div class="n">${M.filter(m=>m.ty==='国外企业').length}</div><div class="l">国外</div></div><div class="sti"><div class="n">${M.filter(m=>m.ty!=='国外企业').length}</div><div class="l">国内</div></div><div class="sti"><div class="n">12</div><div class="l">收录数量</div></div>`;
  document.getElementById('tbM').innerHTML=`<span class="cnt">匹配 ${flt.length} 家</span>`;
  document.getElementById('gdM').innerHTML=flt.map(m=>`<div class="card cc"><div class="hd"><div class="ic ic1">${m.n[0]}</div><div><div class="tl">${m.n}</div><div class="me">${m.e}</div></div><span class="rtt" style="margin-left:auto">${m.ty}</span></div><div class="ds">${m.d}</div><div class="me">📍 ${m.loc} · 🏷 ${m.r}</div><div class="me">📊 ${m.v}</div><div class="ft">${m.w?`<a href="${m.w}" target="_blank">官网 →</a>`:''}</div></div>`).join('')||'<div style="text-align:center;padding:3rem;color:var(--mu);grid-column:1/-1">没有匹配</div>';
}

function setDom(d){curDom=curDom===d?'all':d;render()}
function setLic(l){curLic=curLic===l?'all':l;render()}
function setRoute(r){curRoute=curRoute===r?'all':r;render()}
function render(){if(curTab==='codes')renderCodes();else if(curTab==='devices')renderDevices();else if(curTab==='companies')renderCompanies();else if(curTab==='papers')renderPapers();else renderFunding()}
function switchTab(t){curTab=t;curDom='all';curLic='all';curRoute='all';document.querySelectorAll('nav a').forEach(a=>a.classList.remove('sel'));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(t).classList.add('active');document.getElementById('nav'+t[0].toUpperCase()+t.slice(1)).classList.add('sel');document.getElementById('search').value='';render()}
function renderPapers(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const flt=P.filter(p=>!q||(p.t+' '+p.a+' '+p.c+' '+p.h).toLowerCase().includes(q));
  document.getElementById('statsP').innerHTML=`<div class="sti"><div class="n">${P.length}</div><div class="l">收录文献</div></div><div class="sti"><div class="n">${[...new Set(P.map(p=>p.c))].length}</div><div class="l">关联代码</div></div><div class="sti"><div class="n">${[...new Set(P.map(p=>p.j))].length}</div><div class="l">期刊来源</div></div><div class="sti"><div class="n">${P.length}</div><div class="l">收录数量</div></div>`;
  document.getElementById('tbP').innerHTML=`<span class="cnt">匹配 ${flt.length} 篇</span>`;
  document.getElementById('gdP').innerHTML=flt.map(p=>`<div class="card"><div class="hd"><div class="ic ic3">${p.t[0]}</div><div><div class="tl">${p.t.slice(0,60)}${p.t.length>60?'…':''}</div><div class="me">👤 ${p.a} · 📅 ${p.y} · 📰 ${p.j}</div></div></div><div class="ds">${p.h}</div><div class="ft">🔗 关联代码: <b>${p.c}</b>${p.l?` · <a href="${p.l}" target="_blank">论文链接 →</a>`:''}</div></div>`).join('')||'<div style="text-align:center;padding:3rem;color:var(--mu);grid-column:1/-1">没有匹配</div>';
}
function renderFunding(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const flt=F.filter(f=>!q||(f.n+' '+f.o+' '+f.h).toLowerCase().includes(q));
  document.getElementById('statsF').innerHTML=`<div class="sti"><div class="n">${F.length}</div><div class="l">融资事件</div></div><div class="sti"><div class="n">${[...new Set(F.map(f=>f.o))].length}</div><div class="l">涉及企业</div></div><div class="sti"><div class="n">${Math.round(F.reduce((s,f)=>s+(parseFloat(f.amt)||0),0)*10)/10}</div><div class="l">总金额(亿美元)</div></div><div class="sti"><div class="n">${F.length}</div><div class="l">收录数量</div></div>`;
  document.getElementById('tbF').innerHTML=`<span class="cnt">匹配 ${flt.length} 条</span>`;
  document.getElementById('gdF').innerHTML=flt.map(f=>`<div class="card"><div class="hd"><div class="ic ic4">${f.n[0]}</div><div><div class="tl">${f.o} · ${f.ev}</div><div class="me">💰 ${f.amt} · 📅 ${f.y}</div></div></div><div class="ds">${f.h}</div></div>`).join('')||'<div style="text-align:center;padding:3rem;color:var(--mu);grid-column:1/-1">没有匹配</div>';
}
renderCodes();
</script>
</body>
</html>
