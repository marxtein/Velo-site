<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Fusion Hub · 聚变信息入口</title>
<style>
:root{--bg:#f8f7f4;--surf:#fff;--txt:#1c1c1c;--mu:#5c5c5c;--ac:oklch(0.52 0.18 25);--bd:oklch(0.86 0.01 90);--tg:oklch(0.95 0.02 90)}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
h1,h2{font-family:Georgia,serif}
header{position:sticky;top:0;z-index:100;background:oklch(1 0 0/0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hi{max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:1rem;height:54px;padding:0 1.2rem}
.logo{font-family:Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--ac);text-decoration:none;white-space:nowrap}
.logo span{color:var(--mu);font-weight:400;font-size:.75rem;margin-left:.3em}
nav{display:flex;gap:.8rem;flex:1;overflow-x:auto}
nav a{color:var(--mu);text-decoration:none;font-size:.82rem;font-weight:500;padding:3px 0;border-bottom:2px solid transparent;transition:.15s;cursor:pointer;white-space:nowrap}
nav a:hover,nav a.sel{color:var(--txt);border-color:var(--ac)}
.sr input{width:220px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-size:.82rem;outline:none}
.sr input:focus{border-color:var(--ac)}
main{max-width:1340px;margin:0 auto;padding:1rem 1.2rem 3rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:1.2rem}
.sti{text-align:center;padding:.6rem .3rem;background:var(--surf);border:1px solid var(--bd);border-radius:10px}
.sti .n{font-family:Georgia,serif;font-size:1.4rem;font-weight:700;color:var(--ac)}
.sti .l{font-size:.7rem;color:var(--mu)}
.tb{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;align-items:center}
.tb .gr{display:flex;flex-wrap:wrap;gap:.25rem}
.tb .lb{font-size:.72rem;color:var(--mu);font-weight:600;margin-right:.15rem}
.tb .tag{padding:.2rem .5rem;border-radius:100px;font-size:.7rem;background:var(--tg);color:var(--mu);cursor:pointer;border:1px solid transparent;transition:.15s;font-weight:500}
.tb .tag:hover,.tb .tag.on{background:var(--ac);color:#fff}
.tb .cnt{font-size:.76rem;color:var(--mu);margin-left:auto}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:.6rem}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:.8rem .9rem;transition:.15s;display:flex;flex-direction:column;gap:.35rem}
.card:hover{box-shadow:0 4px 16px oklch(0 0 0/0.06)}
.card .hd{display:flex;align-items:flex-start;gap:.4rem}
.card .ic{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;background:oklch(0.9 0.05 25);color:oklch(0.38 0.15 26)}
.card .tl{font-family:Georgia,serif;font-size:.93rem;font-weight:700}
.card .me{font-size:.73rem;color:var(--mu)}
.card .lc{font-size:.68rem;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
.lo{background:oklch(0.87 0.08 18);color:#0d7a3e}.lc2{background:oklch(0.86 0.06 16);color:#b23b1e}
.card .ds{font-size:.78rem;color:var(--mu);line-height:1.4}
.card .tgs{display:flex;flex-wrap:wrap;gap:.18rem}
.card .tgs span{font-size:.66rem;padding:1px 4px;border-radius:100px;background:var(--tg);color:var(--mu)}
.card .ft{display:flex;align-items:center;gap:.3rem;margin-top:auto;padding-top:.3rem;border-top:1px solid var(--bd);flex-wrap:wrap}
.card .ft a{color:var(--ac);font-size:.74rem;text-decoration:none;font-weight:500}
.card .ft a:hover{text-decoration:underline}
.rt{font-size:.68rem;padding:1px 6px;border-radius:3px;font-weight:600;color:#fff}
.rt-t{background:oklch(0.44 0.13 26)}.rt-s{background:oklch(0.4 0.11 22)}.rt-f{background:oklch(0.46 0.1 20)}.rt-i{background:oklch(0.42 0.08 28)}.rt-o{background:var(--mu)}
.section{display:none}.section.active{display:block}
@media(max-width:700px){.hi{flex-wrap:wrap;height:auto;padding:.4rem .6rem;gap:.5rem}nav{width:100%}.sr{width:100%}.sr input{width:100%}.gd{grid-template-columns:1fr}.st{grid-template-columns:repeat(2,1fr)}.detail-box{max-height:90vh;padding:1.2rem;border-radius:12px}.detail-box h2{font-size:1.05rem}}
.fb-btn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:999;transition:.2s}.fb-btn:hover{transform:scale(1.08);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.fb-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center}.fb-modal.open{display:flex}
.fb-box{background:var(--surf);border-radius:14px;padding:1.4rem;width:90%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.12)}.fb-box h3{font-family:Georgia,serif;font-size:1.1rem;margin-bottom:.8rem}
.fb-box label{font-size:.78rem;color:var(--mu);display:block;margin:.5rem 0 .2rem}
.fb-box .fb-types{display:flex;gap:.4rem;flex-wrap:wrap}
.fb-box .fb-types span{padding:.3rem .6rem;border-radius:100px;font-size:.74rem;background:var(--tg);color:var(--mu);cursor:pointer;border:1px solid transparent;transition:.15s}
.fb-box .fb-types span.sel{background:var(--ac);color:#fff}
.fb-box textarea{width:100%;height:100px;margin-top:.4rem;border:1px solid var(--bd);border-radius:8px;padding:.6rem;font-size:.82rem;font-family:inherit;resize:vertical;outline:none}
.fb-box textarea:focus{border-color:var(--ac)}
.fb-box input[type=text]{width:100%;margin-top:.4rem;border:1px solid var(--bd);border-radius:8px;padding:.5rem .6rem;font-size:.82rem;outline:none}
.fb-box input:focus{border-color:var(--ac)}
.fb-box .fb-actions{display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end}
.fb-box .fb-actions button{padding:.4rem 1rem;border-radius:8px;font-size:.82rem;border:none;cursor:pointer}
.fb-submit{background:var(--ac);color:#fff}.fb-submit:disabled{opacity:.5;cursor:default}
.fb-cancel{background:var(--tg);color:var(--mu)}
.fb-msg{text-align:center;font-size:.82rem;color:var(--ac);margin-top:.5rem;display:none}

.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
.detail-overlay.open{display:flex}
.detail-box{background:var(--surf);border-radius:14px;padding:1.6rem;width:90%;max-width:620px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15);position:relative}
.detail-box h2{font-family:Georgia,serif;font-size:1.2rem;margin-bottom:.2rem;padding-right:2rem}
.detail-box .d-sub{font-size:.78rem;color:var(--mu);margin-bottom:.4rem}
.detail-box .d-meta{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;margin-bottom:.6rem}
.detail-box .d-mtag{font-size:.68rem;padding:1px 8px;border-radius:3px;background:oklch(0.92 0.03 24);color:oklch(0.42 0.13 26);font-weight:600}
.detail-box .d-tag{font-size:.64rem;padding:1px 6px;border-radius:100px;background:var(--tg);color:var(--mu)}
.detail-box .d-features-label{font-size:.74rem;font-weight:700;margin-bottom:.3rem;color:var(--txt)}
.detail-box .d-body{font-size:.85rem;line-height:1.7;color:var(--txt);margin-bottom:1rem}
.detail-box .d-features{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.detail-box .d-features span{font-size:.72rem;padding:2px 8px;border-radius:100px;background:oklch(0.95 0.03 20);color:oklch(0.4 0.12 26)}
.detail-box .d-links{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--bd)}
.detail-box .d-links a{color:var(--ac);font-size:.78rem;text-decoration:none;margin-right:1rem}
.detail-box .d-links a:hover{text-decoration:underline}
.detail-close{position:absolute;top:.8rem;right:1rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--mu);line-height:1}
.detail-close:hover{color:var(--txt)}
.card.has-detail{cursor:pointer}
.card.has-detail:hover{box-shadow:0 4px 16px oklch(0.52 0.18 25/0.12)}

</style>

const P=[{t:"聚变能源研究态势及展望",a:"待补充",j:"待补充",y:"2024",h:"聚变能源开发有望重塑未来能源发展格局，正处于突破工程能量“得失相当”的关键阶段，机遇与挑战并存。本文总结了聚变能源研究的主要进展，凝练了能量平衡尚未实现、氚自持尚未得到验证、实现高可利用率难度极高、耐辐照材料开发进展缓慢、使用经济性普遍较差等发展挑战。在梳理国际热核聚变实验堆（ITER）计划的共性基",c:"待补充",l:"https://www.engineering.org.cn/sscae/CN/10.15302/J-SSCAE-2024.04.005"},{t:"Electron temperature gradient driven turbulence",a:"待补充",j:"待补充",y:"2000",h:"通过大规模并行回旋动理学模拟，研究了环形等离子体中碰撞less电子温度梯度(ETG)驱动湍流。首次发现径向拉长的流束(streamers)可导致ETG模产生显著电子热输运，证实ETG湍流在托卡马克芯部输运中的重要性。",c:"GENE",l:"https://doi.org/10.1063/1.874051"},{t:"The global version of the gyrokinetic turbulence code GENE",a:"待补充",j:"待补充",y:"2011",h:"待补充",c:"GENE",l:"https://doi.org/10.1016/j.jcp.2011.05.034"},{t:"Turbulent Transport Reduction by Zonal Flows: Massively Parallel Simulations",a:"待补充",j:"待补充",y:"1998",h:"利用大规模并行计算机进行三维回旋动理学模拟，研究磁约束环等离子体中微湍流。发现湍流驱动的涨落带状流(zonal flows)可显著降低湍流输运。全局与局域模拟中观察到的流动力学差异源于径向边界条件的不同处理。这是证实带状流抑制湍流输运的里程碑论文。",c:"GTC",l:"https://doi.org/10.1126/science.281.5384.1835"},{t:"DESC: A stellarator equilibrium solver",a:"待补充",j:"待补充",y:"2020",h:"提出了一种新型仿星器三维MHD平衡求解器DESC，采用谱方法直接求解Grad-Shafranov方程的广义形式，避免了传统VMEC方法中假设磁面存在的限制，可处理磁岛和随机磁场区域。",c:"DESC",l:"https://doi.org/10.1017/S0022377820000938"},{t:"The DESC stellarator code suite. Part 1. Quick and accurate equilibria computati",a:"待补充",j:"待补充",y:"2023",h:"作为DESC仿星器代码套件三部曲的首篇，系统介绍了DESC求解三维MHD平衡的理论基础和数值方法。DESC采用伪谱法求解力平衡方程，摆脱了传统VMEC对磁面的依赖，在计算速度、精度和鲁棒性上均有显著提升。",c:"DESC",l:"https://doi.org/10.1017/S0022377823000861"},{t:"Predictive transport simulations of T-15MD with TORAX",a:"待补充",j:"待补充",y:"2024",h:"利用Google DeepMind开发的TORAX输运模拟框架，对俄罗斯T-15MD托卡马克装置进行预测性输运模拟，验证了基于JAX的快速集成模拟方法在现有装置上的适用性。",c:"TORAX",l:"https://doi.org/10.48550/arXiv.2406.06718"},{t:"The EIRENE and B2-EIRENE Codes",a:"待补充",j:"待补充",y:"2005",h:"待补充",c:"EIRENE",l:"https://doi.org/10.13182/fst47-172"},{t:"Conservative discontinuous Galerkin schemes for nonlinear Dougherty–Fokker–Planc",a:"待补充",j:"待补充",y:"2020",h:"待补充",c:"Gkeyll",l:"https://doi.org/10.1017/S0022377820000707"},{t s://www.gov.uk/government/news/west-burton-selected-as-home-of-step-fusion-plant"},{t:"IAEA在成都发布World Fusion Outlook 2025并召开世界聚变能源集团部长级会议",s:"IAEA在成都相关会议期间发布World Fusion Outlook 2025，聚合全球聚变政策、项目和产业发展信息。",d:"2025-10-14",p:"国际组织/产业报告",u:"https://www.iaea.org/newscenter/pressreleases/iaea-launches-world-fusion-outlook-2025-at-world-fusion-energy-group-ministerial-meeting-in-china"},{t:"SHINE获得DOE/NNSA 3200万美元Mo-99供应链资助",s:"SHINE获DOE/NNSA 3200万美元资助，用于支持美国钼-99供应链建设，体现聚变中子源在同位素生产上的商业落地。",d:"2024-07-17",p:"政府资助/同位素",u:"https://www.shinefusion.com/blog/shine-technologies-awarded-32m-by-doe-nnsa-to-support-production-of-molybdenum-99"},{t:"SHINE获得DOE最高2.63亿美元条件贷款承诺",s:"DOE披露SHINE获得最高2.63亿美元条件贷款承诺，用于推进美国本土Mo-99生产能力。",d:"2026-04-09",p:"政府贷款/同位素",u:"https://www.energy.gov/nnsa/articles/nnsa-transitions-american-made-molybdenum-99-effort-doe-office-energy-dominance"},{t:"CFS宣布SPARC主机厂房施工超过75%，真空室组装启动",s:"CFS披露SPARC主机厂房施工超过75%，并启动真空室组装等关键工程节点。",d:"2026-05-14",p:"装置建设",u:"https://blog.cfs.energy/cfs-takes-its-next-step-toward-fusion-energy/"},{t:"CFS成为首家进入PJM互联队列的聚变能源公司",s:"CFS公开表示其ARC项目进入PJM电网互联队列，这是商业聚变项目从技术验证走向并网流程的重要信号。",d:"2026-04-30",p:"电网接入/商业电站",u:"https://blog.cfs.energy/cfs-is-the-first-fusion-energy-company-to-enter-the-pjm-grid-interconnection-queue/"},{t:"CFS与Eni签署价值超过10亿美元的聚变电力采购协议",s:"CFS宣布与Eni签署价值超过10亿美元的电力采购协议，扩大ARC商业电站的潜在客户基础。",d:"2025-09-18",p:"商业订单",u:"https://blog.cfs.energy/cfs-announces-over-1b-power-purchase-agreement-with-eni/"},{t:"CMC资本旗下华文清能基金领投东昇聚变",s:"东昇聚变近日完成新一轮数亿元融资，由CMC资本旗下华文清能基金等联合领投。公司依托复旦大学成立，核心团队经验丰富，布局氘-氦3终极清洁聚变路线，第一代\"晨光\"实验装置稳步推进建设。",d:"2026-05-27",p:"融资",u:"https://news.pedaily.cn/202605/564475.shtml"},{t:"中科聚变太赫兹完成2026年度第二轮融资，持续深耕可控核聚变诊断领域",s:"中科聚变太赫兹三个月内连续完成两轮股权融资：B+轮（鼎晖投资/前海方舟/航天科工，约1亿元）与B++轮（航天科工领投，东方嘉富/创合汇跟投，数亿元）。国内唯一聚变太赫兹诊断全套方案商业化主体，已为EAST/BEST等七类装置供货。",d:"2026-05-27",p:"融资",u:"https://mp.weixin.qq.com/s/9djjLB3vRpxjFWS2h66czA"},{t:"东曦聚变完成数亿元天使轮融资，中科创星领投",s:"东曦聚变能源科技（北京）有限公司宣布完成数亿元人民币天使轮融资，中科创星领投，华控基金、联想之星、苏创投、飞图创投参投。公司聚焦激光惯性约束聚变商业化，将围绕高能量激光驱动、靶丸工程、实验诊断、仿真计算、系统集成与AI应用推进研发。",d:"2026-05-28",p:"融资",u:"https://m.cnfin.com/cy-lb/zixun/20260528/4418650_1.html"},{t:"Pacific Fusion完成超10亿美元融资，General Catalyst领投",s:"美国脉冲磁惯性聚变公司Pacific Fusion宣布完成超10亿美元融资，General Catalyst领投。此轮融资超越此前9亿美元承诺，成为聚变行业最大单轮融资之一。",d:"2026-06-03",p:"融资",u:"https://news.qq.com/rain/a/20260603A07ILF00"},{t:"General Fusion通过与Spring Valley Acquisition III合并实现SPAC上市，估值约10亿美元",s:"加拿大磁化靶聚变公司General Fusion与SPAC公司Spring Valley Acquisition III完成合并，在纳斯达克上市，代码GFUZ，企业价值约10亿美元。这是聚变行业首个SPAC上市案例。",d:"2026-01-22",p:"融资",u:"https://www.ccnta.cn/article/23590.html"},{t:"瞬原科技完成数千万元首轮融资，以万倍加速构建可控核聚变模拟基座",s:"北京瞬原科技有限公司完成数千万元种子轮融资，龙芯创投领投，浙大校友基金藕舫天使、社保基金中关村自主创新专项基金（君联资本担任管理人）跟投。资金将用于扩充研发团队及开发核心等离子体物理算法底座。旗舰产品FusionAlpha部分核心模块计算效率较国际标杆代码提升上万倍。",d:"2026-06-02",p:"融资",u:"https://mp.weixin.qq.com/s/kTPF2WXrCC6jq8aCgP9AeQ"},{t:"Helion完成4.65亿美元G轮融资，估值达155亿美元",s:"2026年6月5日，Helion Energy完成4.65亿美元G轮融资，由Thrive Capital领投，估值达155亿美元，为2026年迄今全球最大核聚变风险投资轮次。本轮后Helion在聚变公司融资排行榜升至第2位。",d:"2026-06-05",p:"融资",u:"https://thefusionreport.com/"},{t:"Xcimer Energy Phoenix激光聚变原型设施投入运营",s:"2026年6月3日，Xcimer Energy宣布其Phoenix KrF准分子激光系统在科罗拉多州丹佛市正式投入运营。Phoenix是Xcimer商业激光惯性约束聚变架构的原型机，标志着公司从研发阶段迈向实际运营。",d:"2026-06-03",p:"装置进展', '技术进展",u:"https://thefusionreport.com/"},{t:"ITER组织开源发布IMAS集成建模与分析套件",s:"ITER组织于2025年12月8日在GitHub平台以开源许可证正式发布IMAS（集成建模与分析套件），包含托卡马克等离子体场景物理建模代码、数据分析与可视化工具。此举旨在加速全球聚变能源研发，降低行业技术门槛。",d:"2025-12-08",p:"技术进展",u:""},{t:"CFS发表五篇ARC物理基础同行评审论文，验证400MW商用聚变电站可行性",s:"Commonwealth Fusion Systems在《等离子体物理学杂志》特刊发表五篇经同行评审的ARC物理基础论文，由58位科学家撰写。论文基于SPARC经验，分析显示ARC核电站可向电网持续输送400MW净电力，产生约11亿瓦聚变功率。这是商业聚变电站物理基础的里程碑式验证。",d:"2026-06-04",p:"技术进展",u:"https://www.prnewswire.com/news-releases/commonwealth-fusion-systems-builds-on-learnings-from-sparc-to-publish-five-peer-reviewed-papers-validating-the-physics-of-the-arc-fusion-power-plant-302790590.html"},{t:"ITER磁体冷测试设施正式投运，可4K/68kA条件下测试超导磁体",s:"ITER组织宣布磁体冷测试设施正式投入运行，可在4开尔文（-269℃）低温、68千安培满电流条件下开展超导磁体安装前测试。该设施的投运是ITER总装阶段的关键里程碑，将为中央螺线管和环向场磁体的安装验证提供保障。",d:"2026-06-01",p:"装置进展",u:"https://www.ans.org/news/topic-fusion/"},{t:"Helion Polaris原型实现D-T聚变反应，等离子体温度达1.5亿度",s:"Helion Energy宣布其Polaris原型聚变装置近期实现了可测量的氘氚(D-T)聚变反应，等离子体温度达到1.5亿度。这是Helion直接发电路线的重要技术里程碑，为其华盛顿州Orion聚变电站建设提供了关键数据支撑。",d:"2026-06-01",p:"实验纪录",u:"https://www.ans.org/news/topic-fusion/"},{t:"测试记录",s:"待补充",d:"2026-06-11",p:"行业动态",u:""},{t:"东昇聚变完成1亿美元新一轮融资，启明创投/华金资本/工银资本/CMC资本联合领投",s:"《科创板日报》6月10日报道，东昇聚变（上海）技术有限公司完成1亿美元新一轮融资。启明创投、珠海科技产业集团（华金资本）、工银资本、CMC资本联合领投，达晨创投、前海方舟、东方证券、华福成长投资、兰溪资本跟投，中科创星、千乘资本、BV百度风投等老股东持续加注。资金将用于第一代晨光聚变实验装置建设、核",d:"2026-06-10",p:"融资",u:"https://finance.sina.com.cn/roll/2026-06-10/doc-iniaxvfp1183467.shtml"},{t:"核聚变诊断隐形赛道崛起：单装置需求可达数亿元，百亿蓝海市场加速释放",s:"财联社6月8日报道，可控核聚变产业化进程提速，其核心技术赛道关注度持续攀升。国内聚变诊断产业集群加速成型。单座聚变装置总投资超30亿元，诊断系统占比约10%，单装置对应数亿元核心硬件需求，百亿级市场蓝海正加速释放红利。聚变诊断作为装置眼睛，是装置运行安全、物理理解和工程控制的基础保障。",d:"2026-06-08",p:"市场政策",u:"https://finance.sina.com.cn/jjxw/2026-06-08/doc-iniasscs7178056.shtml"},{t:"2026上海碳中和博览会展示聚变前沿技术成果",s:"2026上海国际碳中和技术博览会上，诺瓦聚变能源科技展示了\"诺瓦一号\"小型模块化FRC聚变验证装置，目标离子温度一亿度，规划2030年完成发电演示；上海电气披露了国内最全面的核聚变核心装备供货能力，已具备托卡马克主机系统核心部件成套制造能力，同时布局第四代核电技术。",d:"2026-06-10",p:"产业/展会",u:"https://finance.sina.com.cn/roll/2026-06-11/doc-inicaenm0610945.shtml"},{t:"田纳西州成为美国首个实施核聚变监管框架的州",s:"2026年6月9日，田纳西州正式生效核聚变装置监管规则，成为美国首个落地自主聚变监管框架的州。规则要求聚变设施需注册许可、配备辐射安全官、设立辐射安全委员会。Type One Energy正在该州橡树岭附近推进Infinity Two 400MWe仿星器试点电厂项目，将成为新框架下首批持牌方。该州的",d:"2026-06-09",p:"监管",u:"https://www.tn.gov/environment/news/2026/6/1/tn-powers-up-first-in-the-nation-fusion-regulations-june-9.html"},{t:"宁德时代首次投资核聚变，领投贝塔聚变数亿元种子轮",s:"全球最大动力电池制造商宁德时代领投贝塔聚变（Beta Fusion）数亿元种子轮融资，系宁德时代首次入局核聚变领域。贝塔聚变成立于2025年，专注脉冲型场反位形（FRC）磁惯性约束路线。",d:"2026-06-11",p:"融资', '公司治理/战略",u:"https://finance.sina.com.cn/tech/digi/2026-06-11/doc-iniaztwn2227207.shtml"},{t:"星能玄光完成5亿元A系列融资，加速FRC装置研发",s:"可控核聚变FRC路线企业星能玄光完成A系列两轮合计5亿元融资。新增投资方：金浦投资、达晨财智、基石资本、弘晖基金、世林集团、上海科创集团；老股东蚂蚁集团、中科创星等持续追投。资金将用于提升高性能FRC装置参数。",d:"2026-06-12",p:"融资",u:"https://finance.sina.com.cn/jjxw/2026-06-12/doc-iniccspq1831941.shtml"},{t:"美国能源部发布《聚变科学与技术路线图》，目标2030年代中期商用聚变",s:"2026年6月9日，美国能源部（DOE）正式发布《聚变科学与技术路线图》，收集800余位科学家和工程师意见，明确将2030年代中期实现商用聚变作为目标。",d:"2026-06-09",p:"政策/路线图",u:"https://www.nature.com/articles/d41586-026-01795-z"},{t:"美国能源部批准Xcimer Energy Athena预概念动力堆设计",s:"2026年6月10日，美国能源部正式批准Xcimer Energy提交的共724页Athena预概念动力堆设计方案，标志激光惯性聚变路线进入工程评审阶段。",d:"2026-06-10",p:"装置设计/项目评审",u:"https://thefusionreport.com/"},{t:"苏黎世联邦理工学院研究称聚变发电经验率或被高估，引发业界争议",s:"2026年3月23日，苏黎世联邦理工学院博士生汤灵熹等在《自然·能源》发表论文《Fusion Power Experience Rates Are Overestimated》，指出主流聚变路线经验率仅2%-8%，远低于业界假设的8%-20%，首台聚变电站资本支出估算范围悬殊（1400-43000美",d:"2026-06-12",p:"产业报告",u:"https://finance.sina.com.cn/wm/2026-06-12/doc-inicazrx3568722.shtml"},{t:"湖北省发改委启动磁约束氘氘聚变中子源预研装置项目初步设计咨询评估招标",s:"2026年6月11日，湖北省发展和改革委员会发布磁约束氘氘聚变中子源预研装置项目初步设计概算咨询评估项目招标公告（项目编号HBCZ-2601050939-262199），预算18.10万元，截止时间6月24日14:30。项目属于国家重大科技基础设施建设前期准备工作。",d:"2026-06-11",p:"政府项目', '装置建设",u:"https://hubeibidding.com/view/49003.html"},{t:"测试",s:"待补充",d:"待补充",p:"行业动态",u:""}];

const CD={"GENE":{"full_name":"Gyrokinetic Electromagnetic Numerical Experiment","long_desc":"GENE 是全球最广泛使用的回旋动理学湍流模拟代码之一，由德国马普等离子体物理研究所（Max Planck IPP）Frank Jenko 团队开发。采用连续体欧拉方法在五维相空间中直接求解回旋动理学方程，支持托卡马克和仿星器几何。可模拟 ITG/TEM/ETG 等多种微观不稳定性，支持通量管（flux tube）和全局（global）两种模拟模式，包含碰撞算符、电磁涨落和多粒子种耦合。2025 年在 Nature Communications 发表的多代码对比验证中，GENE 被确认为达到成熟阶段的核心湍流代码。","features":["连续体回旋动理学","通量管/全局双模式","电磁涨落","线性/非线性","托卡马克+仿星器","Landau-Boltzmann 碰撞算符"],"links":["https://genecode.org","https://doi.org/10.1038/s41467-025-56997-2"]},"GTC":{"full_name":"Gyrokinetic Toroidal Code","long_desc":"GTC（回旋动理学环向代码）是由加州大学欧文分校林志宏教授团队开发的全球首个大规模并行回旋动理学 Particle-in-Cell（PIC）代码。采用 δf PIC 方法在真实托卡马克几何中模拟等离子体微观湍流和新经典输运。1998 年在 Science 发表里程碑论文，首次证实带状流对湍流输运的抑制作用。近期版本支持高能粒子与阿尔芬本征模相互作用、全域模拟和 GPU 加速。GTC 是回旋动理学 PIC 方向的标杆。","features":["PIC 回旋动理学","全球模拟","带状流-湍流相互作用","高能粒子-波","GPU 加速"],"links":["http://phoenix.ps.uci.edu/gtc/","https://doi.org/10.1126/science.281.5384.1835"]},"DESC":{"full_name":"DESC Stellarator Equilibrium and Optimization Suite","long_desc":"DESC 是普林斯顿大学 Egemen Kolemen 团队开发的新一代仿星器三维 MHD 平衡与优化代码套件。采用伪谱法和 JAX 自动微分框架，直接在真实空间中求解力平衡方程，摆脱了传统 VMEC 对磁面的假设，能够处理磁岛和随机磁场区域。计算速度比传统方法快 10-100 倍，梯度信息通过自动微分精确获取，可直接耦合优化算法进行仿星器线圈和磁场设计。2023 年以三部曲形式发表在 Journal of Plasma Physics。","features":["伪谱法 MHD 平衡","JAX 自动微分","磁岛/随机场处理","GPU 加速","仿星器优化","准对称设计"],"links":["https://github.com/PlasmaControl/DESC","https://doi.org/10.1017/S0022377823000861"]},"TORAX":{"full_name":"TORAX — Tokamak Rapid Axisymmetric Simulator","long_desc":"TORAX 是 Google DeepMind 与 EPFL 瑞士等离子体中心合作开发的下一代托卡马克输运模拟框架。基于 JAX 可微分编程框架，采用有限体积法求解 1.5D 核心输运方程，可在数秒内完成完整的放电方案模拟。支持自动微分和 GPU 加速，能够高效地进行参数扫描、不确定性量化和逆问题求解。TORAX 代表了聚变模拟向 AI 驱动、快速迭代的新范式，已成功应用于 T-15MD、ITER 等装置的预测性模拟。","features":["1.5D 核心输运","JAX 可微分编程","有限体积法","快速放电模拟","自动微分","GPU 加速"],"links":["https://github.com/google-deepmind/torax","https://doi.org/10.48550/arXiv.2406.06718"]},"GX":{"full_name":"GX — GPU-native Local Gyrokinetic Turbulence Code","long_desc":"GX 是原生 GPU 局域回旋动理学湍流代码，由 Bill Dorland 和 Noah Mandell 领导的 GX Team 开发。采用 Hermite-Laguerre 伪谱方法在速度空间展开，充分利用 GPU 的大规模并行能力。相比传统 CPU 代码，GX 的参数扫描速度提升 100 倍以上，特别适合进行大规模参数空间探索和不确定性分析。支持多种回旋动理学模型（静电/电磁、线性/非线性），正在成为新一代快速湍流预测的标准工具。","features":["GPU-native 回旋动理学","Hermite-Laguerre 谱方法","超快参数扫描","不确定性量化","Python 接口"],"links":["https://gx.readthedocs.io/"]},"WarpX":{"full_name":"WarpX — Advanced Electromagnetic Particle-In-Cell Code","long_desc":"WarpX 是新一代开源高性能电磁 Particle-in-Cell（PIC）代码，由 Jean-Luc Vay、Axel Huebl 等领导的国际团队开发，托管于 ECAP/BLAST 框架下。支持 1D/2D/3D/RZ 几何、自适应网格细化（AMR）、完美匹配层（PML）吸收边界和 boosted-frame 技术，已实现 Exascale GPU 加速。主要应用于激光尾波加速、惯性约束聚变相关的高能量密度等离子体、束流输运和强场物理。2025 年已增强 FRC（场反位形）聚变模拟能力，是 US DOE Exascale 计算项目（ECP）的核心 PIC 代码之一。","features":["电磁PIC","AMR","boosted-frame","GPU Exascale","PML边界","FRC聚变"],"links":["https://github.com/BLAST-WarpX/warpx","https://warpx.readthedocs.io/"]},"EIRENE":{"full_name":"EIRENE — Kinetic Neutral Particle & Radiation Transport Code","long_desc":"EIRENE 是全球磁约束聚变边界物理的标准中性粒子蒙特卡洛输运代码，由 FZ Jülich 的 Detlev Reiter 团队开发维护。采用三维动理学方法模拟中性气体分子、原子和光子在等离子体边界和偏滤器区域的输运过程，涵盖原子-分子反应、电荷交换、电离和辐射等多物理过程。EIRENE 通常与 SOLPS（2D 流体等离子体求解器）耦合为 SOLPS-EIRENE 套件，或与 EMC3 耦合处理仿星器三维边界输运。该套件是 ITER 边界和偏滤器设计的核心工具，对预测脱靶状态、杂质输运和靶板热负荷至关重要。","features":["蒙特卡洛","中性粒子输运","原子-分子反应","SOLPS耦合","偏滤器模拟","辐射输运"],"links":["https://www.eirene.de/","https://github.com/iterorganization/EIRENE"]},"VMEC":{"full_name":"VMEC — Variational Moments Equilibrium Code","long_desc":"VMEC 是磁约束聚变领域最经典的三维理想 MHD 平衡求解器，由 S.P. Hirshman 和 ORNL/PPPL 仿星器社区开发。采用变分矩方法和傅里叶谱展开，在固定边界条件下计算三维环形等离子体的 MHD 平衡磁场位形，假设嵌套磁面存在。VMEC 是仿星器设计（W7-X、LHD、HSX、CFQS）的标准平衡求解器，也是 STELLOPT、SIMSOPT 等仿星器优化代码的核心输入。其输出包括磁面几何、iota 剖面、极向和环向磁通坐标映射，经过 40 余年验证，至今仍是仿星器研究的基石代码。","features":["变分法","谱方法","MHD平衡","仿星器标准","嵌套磁面","傅里叶展开"],"links":["https://github.com/ORNL-Fusion/VMEC_8_00"]},"M3D-C1":{"full_name":"M3D-C1 — 3D Extended MHD Code with C1 Finite Elements","long_desc":"M3D-C1 是 PPPL 的 S.C. Jardin 和 N.M. Ferraro 团队开发的高阶三维扩展 MHD 代码。采用 C1 连续有限元方法（保证磁通函数一阶导数连续），支持双流体和单流体扩展 MHD 模型，可求解托卡马克真实 X-point 几何下的非线性等离子体演化。主要应用于 ELM（边界局域模）爆发机理、垂直位移事件（VDE）、等离子体破裂、halo 电流和共振磁扰动（RMP）响应等瞬态事件模拟。2024 年在 Nuclear Fusion 发表了该代码对托卡马克瞬态的非线性 MHD 建模综述。","features":["C1有限元","扩展MHD","X-point几何","ELM模拟","破裂/VDE","双流体"],"links":["https://w3.pppl.gov/~nferraro/m3dc1.html"]},"Gkeyll":{"full_name":"Gkeyll — Discontinuous Galerkin Gyrokinetic Code","long_desc":"Gkeyll 是由 Ammar Hakim 团队开发的高阶间断伽辽金（DG）动理学代码，同时支持 Vlasov-Maxwell 和回旋动理学模型。采用能量守恒的半离散 DG 格式，在速度空间使用 discontinuous Galerkin 方法，能够实现无噪声（noise-free）的动理学模拟。主要用于托卡马克边界刮削层（SOL）湍流、鞘层物理、等离子体-壁相互作用等边界等离子体问题，也可用于空间等离子体基础研究。2023-2024 年扩展了电磁回旋动理学能力，支持全 f 分布函数演化，是边界湍流研究的重要前沿代码。","features":["间断伽辽金","动理学","无噪声模拟","SOL湍流","鞘层物理","Vlasov-Maxwell"],"links":["https://gkeyll.readthedocs.io/","https://github.com/ammarhakim/gkyl"]},"OSIRIS":{"full_name":"OSIRIS — Relativistic Electromagnetic PIC Code","long_desc":"OSIRIS 是 UCLA 等离子体模拟组和葡萄牙 IST 联合开发的相对论全电磁 PIC 代码，是激光等离子体加速领域的标杆性模拟工具。支持 1D/2D/3D 全电磁模型、电流沉积和电荷守恒方案、动态负载平衡和 MPI+OpenMP 并行。主要应用于激光尾波电子加速（LWFA）、质子加速（TNSA/RPA）、正电子产生、惯性约束聚变中的激光-等离子体相互作用和强场 QED 效应。OSIRIS 的开创性模拟直接推动了激光等离子体加速领域的多项实验突破。","features":["全电磁PIC","激光尾波加速","电荷守恒","QED效应","并行负载平衡"],"links":["https://plasmasim.physics.ucla.edu/codes/osiris"]},"VPIC":{"full_name":"VPIC — Vector Particle-In-Cell Code","long_desc":"VPIC 是 LANL（洛斯阿拉莫斯国家实验室）开发的高性能相对论全电磁 PIC 代码，专为大规模并行架构优化。采用矢量数据结构和混合模式并行（MPI+线程），在 Exascale 超级计算机上实现极高效率的粒子推送和场求解。主要应用于磁重联、湍流、激光等离子体相互作用和高能量密度物理。VPIC 以极简实现实现顶级性能，2024 年在 Frontier 等 Exascale 系统上展示了数十亿粒子规模的激光聚变模拟。","features":["全电磁PIC","矢量数据结构","Exascale","磁重联","激光等离子体"],"links":["https://github.com/lanl/vpic"]},"TRANSP":{"full_name":"TRANSP — Tokamak TRANsport Simulation Code","long_desc":"TRANSP（原名 TRANSPORT）是 PPPL 开发的托卡马克输运分析与模拟代码，已有 40 余年历史，是全球磁约束聚变实验数据分析的标准工具。采用经典的时变输运方程求解框架，通过实验约束和唯象输运模型进行约束分析和预测模拟。核心功能包括：功率平衡分析、粒子输运、动量输运、快离子轨道分析（NUBEAM 耦合）、杂质输运和源项计算。TRANSP 被 ITER、JET、DIII-D、EAST 等全球主要托卡马克广泛使用，是实验分析和输运模型验证的标准平台。","features":["输运分析","功率平衡","NUBEAM耦合","杂质输运","ITER/JET标配"],"links":["https://w3.pppl.gov/transp/"]},"RAPTOR":{"full_name":"RAPTOR — RApid Plasma Transport simulatOR","long_desc":"RAPTOR 是 EPFL 瑞士等离子体中心开发的快速托卡马克输运模拟器，专为实时控制和离线快速预测设计。采用 1D 输运方程建模，结合降阶模型和神经网络的代理方法，可在毫秒量级完成完整的放电演化预测。RAPTOR 已成功部署于 TCV、ASDEX Upgrade 和 JET 等装置的实时控制系统，作为等离子体状态观测器提供在线剖面预测。2023-2025 年扩展了结合物理约束的神经网络代理模型，被 TCV real-time control 框架集成。","features":["快速输运模拟","实时控制","降阶模型","神经网络代理","TCV/AUG部署"],"links":["https://github.com/SPCData/raptor"]},"SOLPS-ITER":{"full_name":"SOLPS-ITER — Scrape-Off Layer Plasma Simulation for ITER","long_desc":"SOLPS-ITER 是 ITER 组织主导、国际合作开发的边界等离子体模拟代码套件，是目前全球磁约束聚变刮削层/偏滤器物理的标准工具。由二维流体代码 B2(.5) 和三维动理学蒙特卡洛中性粒子代码 EIRENE 耦合组成，支持氘-氚、杂质和多粒子种耦合输运。SOLPS-ITER 是 ITER 偏滤器设计优化（钨偏滤器与气体注入方案）、脱靶预测、热通量评估和第一壁保护的核心工具，也被 EAST、JET、ASDEX Upgrade、DIII-D、KSTAR 等装置广泛用于边界物理分析。","features":["B2+EIRENE耦合","刮削层物理","偏滤器设计","脱靶模拟","ITER核心工具"],"links":["https://github.com/iterorganization/SOLPS-ITER","https://solps-iter.org/"]},"CGYRO":{"full_name":"CGYRO — Collisional Gyrokinetic Code","long_desc":"CGYRO 是 General Atomics（GA）Jeff Candy 团队开发的亚离子拉莫尔半径尺度回旋动理学湍流代码。采用局域通量管近似和谱方法（场向坐标+Fourier+Laguerre展开）求解回旋动理学方程，重点处理碰撞算符和电磁涨落。CGYRO 以其精确的完全线性化 Fokker-Planck 碰撞算符著称，能够精确捕获托卡马克芯部的 ITG、TEM、ETG 等多尺度湍流输运。是 GACODE（GA/PPPL/ORNL 合作框架）的核心湍流求解器之一，已广泛用于 DIII-D、JET、ITER 等装置的预测性模拟。","features":["回旋动理学","谱方法","Fokker-Planck碰撞","电磁湍流","局域通量管"],"links":["https://github.com/gafusion/gacode"]},"GS2":{"full_name":"GS2 — Gyrokinetic Stability and Transport Code","long_desc":"GS2 是经典的回旋动理学湍流稳定性和输运代码，由 PPPL Bill Dorland 团队（后转为多机构联合）开发，是 GENE/GYRO 之前的第一代通用回旋动理学连续体求解器。采用局域通量管近似，在气球模坐标中使用有限差分和伪谱混合方法求解线性和非线性回旋动理学方程。虽然已不再是最现代的回旋代码，但 GS2 对理解回旋动理学湍流物理（包括 ETG 驱动的电子热输运、带状流物理）做出了奠基性贡献，其方法论被后续代码广泛继承。","features":["回旋动理学","气球模坐标","局域通量管","线性/非线性","历史经典"],"links":["https://gyrokinetics.gitlab.io/gs2/"]},"SPEC":{"full_name":"SPEC — Stepped Pressure Equilibrium Code","long_desc":"SPEC 是普林斯顿大学 Stuart Hudson 和 PPPL 团队开发的三维 MHD 平衡求解器，创新性地采用多区域变分原理（MRxMHD），将等离子体划分为多个嵌套的压力台阶区域。与 VMEC 不同，SPEC 不假设全局磁面存在，可自然处理磁岛、随机磁场区域和部分破坏的磁面结构。这使得 SPEC 在分析仿星器磁岛物理、三维 MHD 平衡分岔和会切/开放场线区域（如 W7-X 岛偏滤器）方面具有独特优势。SPEC 正在成为仿星器和三维托卡马克平衡物理研究的重要补充工具。","features":["多区域MHD","磁岛处理","变分原理","仿星器专用","压力台阶"],"links":["https://github.com/PrincetonUniversity/SPEC"]},"XGC":{"full_name":"XGC — X-point Gyrokinetic Code","long_desc":"XGC 是 PPPL 开发的全球第一款全 f 回旋动理学全域代码，也是唯一能同时处理托卡马克芯部和刮削层/偏滤器全 X-point 几何的动理学代码。采用 PIC 方法，在真实托卡马克磁面上进行全域回旋动理学模拟，跨芯部-边界-刮削层（SOL）连续区域。支持中性粒子回旋动理学和动理学电子，可模拟偏滤器鞘层、跨 LCFS 输运和 ELM 热脉冲沉积等关键过程。XGC 是 ITER 和 SPARC 等下一代装置边界物理预测的关键工具。","features":["全域PIC","全f分布","X-point几何","芯部-边界耦合","偏滤器动理学"],"links":["https://xgc.pppl.gov/"]},"ASCOT5":{"full_name":"ASCOT5 — Accelerated Simulation of Charged particle Orbits in Tori","long_desc":"ASCOT5 是欧洲 EUROfusion 资助开发的第五代带电粒子轨道蒙特卡洛代码，由芬兰 VTT/CSC 联合多国团队开发。采用 GPU 加速和 MPI 并行，在三维真实磁场中追踪快离子、聚变产物（α粒子）、杂质离子和中性粒子的完整轨道。主要应用于高能粒子约束和损失评估（NBI 快离子、α粒子）、第一壁热负荷预测、杂质输运和气体注入模拟。ASCOT5 已广泛用于 JET、ASDEX Upgrade、W7-X 和 ITER 的高能粒子物理、第一壁工程和杂质控制研究。","features":["GPU加速蒙特卡洛","粒子轨道追踪","高能粒子损失","第一壁热负荷","3D磁场"],"links":["https://github.com/fusion-energy/ASCOT5"]},"BOUT++":{"full_name":"BOUT++ — Boundary Turbulence Simulation Framework","long_desc":"BOUT++ 是国际上主流的托卡马克边界等离子体湍流模拟框架，由英国 York 大学 Ben Dudson 团队领导的多国合作项目。采用有限差分方法在 3D 磁场对齐坐标中求解流体和双流体 Braginskii 方程，支持任意环形几何和 X-point 位形。主要研究边界局域模（ELM）、刮削层湍流、blob/filament 传播、偏滤器热通量展宽和 RMP 响应等关键物理过程。BOUT++ 以其开源社区驱动模式和丰富的物理模块生态著称。","features":["边界湍流","Braginskii方程","X-point几何","ELM/blob","开源社区"],"links":["https://github.com/boutproject/BOUT-dev","https://boutproject.github.io/"]},"Hermes-3":{"full_name":"Hermes-3 — 3D Plasma Fluid & Neutral Transport Code","long_desc":"Hermes-3 是英国 CCFE/York 大学开发的先进三维等离子体流体与中性粒子耦合输运代码，是 BOUT++ 生态系统的高级分支。采用各向异性热传导模型和漂移流体方程，与 EIRENE 中性粒子代码耦合，在真实托卡马克三维几何中模拟边界等离子体和偏滤器物理。特别擅长处理偏滤器脱靶、跨场输运与平行输运耦合、以及气体注入响应等复杂边界过程。Hermes-3 被 EUROfusion 和 UKAEA 选为 STEP 原型堆边界设计的核心工具之一。","features":["3D流体","各向异性输运","EIRENE耦合","偏滤器脱靶","STEP设计工具"],"links":["https://github.com/boutproject/hermes-3"]},"JOREK":{"full_name":"JOREK — Non-linear Extended MHD Code for Tokamak Transients","long_desc":"JOREK 是 EUROfusion 资助的非线性扩展 MHD 代码，由多国联合团队（IPP Garching、CEA、CCFE 等）开发，是目前模拟托卡马克瞬态事件的最先进代码之一。采用 G1 连续 Bezier 有限元方法，在真实 X-point 几何和磁面对齐网格上求解约化 MHD 和扩展 MHD 方程。核心应用包括 ELM 爆发全过程（触发→崩塌→热脉冲→恢复）、等离子体破裂演化、垂直位移事件（VDE）、破裂缓解（SPI/MPI 注入）和 RMP 锁模物理。2024 年在 Nuclear Fusion 发表综述论文系统总结了该代码在托卡马克瞬态 MHD 建模中的最新进展。","features":["Bezier有限元","扩展MHD","ELM全过程","破裂模拟","SPI缓解"],"links":["https://jorek.eu/","https://doi.org/10.1088/1741-4326/ad5a21"]},"NIMROD":{"full_name":"NIMROD — Non-Ideal Magnetohydrodynamics with Rotation, Open Discussion","long_desc":"NIMROD 是美国多机构（UW-Madison、TTU 等）联合开发的非理想 MHD 代码，专注于研究托卡马克和其他聚变装置中的宏观 MHD 稳定性和三维非线性演化。采用 2D 有限元+1D 傅里叶展开的混合离散方法，求解包括电阻、粘滞、各向异性热传导和双流体效应的扩展 MHD 方程。核心应用包括锯齿振荡、锁模、新经典撕裂模（NTM）、电阻壁模（RWM）和等离子体破裂模拟。NIMROD 在理解 DIII-D 和 NSTX 的破裂物理方面做出了关键贡献。","features":["混合有限元/傅里叶","非理想MHD","NTM/RWM","破裂","双流体"],"links":["https://github.com/nimrod-team/NIMROD"]},"TGLF":{"full_name":"TGLF — Trapped Gyro-Landau-Fluid Transport Model","long_desc":"TGLF 是 General Atomics（GA）开发的最广泛使用的准线性回旋流体输运模型，是 GA 标准输运代码套件（GACODE）的核心组件。基于捕获粒子回旋朗道流体近似，将非线性湍流饱和规则参数化为线性增长率和本征模结构的函数，可在毫秒内计算湍流输运通量。TGLF 已成功复现多个装置（DIII-D、JET、ASDEX Upgrade、EAST）的芯部输运实验数据，是 ITER 和 SPARC 等下一代装置输运预测的标准降阶模型。2024 年发布了 TGLF-SAT2 饱和规则更新版本，显著提升了高 β 等离子体预测精度。","features":["准线性输运","回旋流体","SAT2饱和规则","快速预测","ITER/SPARC标配"],"links":["https://github.com/gafusion/gacode"]},"GYRO":{"full_name":"GYRO — Gyrokinetic Continuum Turbulence Code","long_desc":"GYRO 是 General Atomics 的 Jeff Candy 和 Ron Waltz 团队开发的经典回旋动理学连续体湍流代码，是 CGYRO 的前身和 GACODE 套件的奠基之作。采用局域通量管近似和谱/有限差分混合方法求解五维回旋动理学方程。GYRO 在 2000 年代确立了许多回旋动理学验证基准（如 Cyclone Base Case），是证实湍流带状流相互作用和 Dimits shift 物理的里程碑式代码。虽然现已大部分被 CGYRO 取代，但仍作为轻量级验证工具和教学代码广泛使用。","features":["回旋动理学连续体","局域通量管","Cyclone基准","带状流物理","教学验证"],"links":["https://github.com/gafusion/gacode"]},"TGYRO":{"full_name":"TGYRO — Transport + GYRO Integrated Modeling Code","long_desc":"TGYRO 是 General Atomics 开发的芯部等离子体剖面演化求解器，将湍流输运代码（TGLF/CGYRO/GYRO）与新经典输运代码（NEO）耦合，自洽求解温度和密度剖面演化。采用稳态通量匹配方法，在给定的加热/电流驱动功率和边界条件下预测 H 模式台基以上芯部剖面的自组织演化。TGYRO 的核心创新是在每个径向位置调用回旋动理学代码计算湍流通量，然后迭代求解全局输运方程，实现第一性原理预测。是 ITER 和 SPARC 芯部输运预测的标准集成建模工具之一。","features":["剖面演化","TGLF/CGYRO耦合","自洽输运","ITER/SPARC预测","集成建模"],"links":["https://github.com/gafusion/gacode"]},"QuaLiKiz":{"full_name":"QuaLiKiz — Quasi-linear Gyrokinetic Transport Model","long_desc":"QuaLiKiz 是 CEA 的 C. Bourdelle 和 DIFFER 的 J. Citrin 联合开发的准线性回旋动理学湍流输运模型。采用本征值方法结合试验本征函数，在波数空间中计算 ITG/TEM/ETG 湍流驱动的粒子和热通量，避免了非线性回旋代码的巨大计算开销。2019 年推出的 QLKNN（神经网络代理）版本通过 10 维神经网络模拟原始 QuaLiKiz 通量，计算速度提升 1000 倍以上，可在毫秒内完成通量计算，使其能够嵌入实时控制和集成建模框架。QuaLiKiz/QLKNN 已广泛用于 JET、JT-60SA、ITER 和 CFETR 的输运预测和放电方案设计，是欧洲集成建模工具链的核心湍流模型之一。","features":["准线性回旋动理学","本征值方法","QLKNN神经网络代理","千倍加速","JET/ITER预测","实时控制兼容"],"links":["https://qualikiz-group.gitlab.io/QuaLiKiz","https://doi.org/10.1063/1.5132937"]},"OMFIT":{"full_name":"OMFIT — One Modeling Framework for Integrated Tasks","long_desc":"OMFIT 是 General Atomics 的 O. Meneghini 团队开发的磁约束聚变集成建模与实验数据分析旗舰平台。采用类似 MATLAB 的 Python 交互式环境，通过标准化接口编排数十个物理解码（EFIT、ONETWO、TGLF、TGYRO、EPED、ELITE、CQL3D 等），支持从平衡重建、输运分析到 MHD 稳定性和加热/电流驱动的全链条工作流。OMFIT 的核心优势在于一站式集成：研究人员可以在同一环境中完成实验数据导入、物理模拟、结果可视化和报告生成。已被 DIII-D、EAST、KSTAR、JET、ITER 和 CFETR 等全球主要装置广泛采用，是聚变集成建模的事实标准平台。","features":["集成建模平台","多代码编排","Python/MATLAB风格","实验-模拟闭环","全球装置标配"],"links":["https://omfit.io/","https://github.com/gafusion/OMFIT-source"]},"OMAS":{"full_name":"OMAS — Ordered Multidimensional Array Structure","long_desc":"OMAS 是 ITER 集成建模与分析套件（IMAS）数据模型的 Python 实现，由 General Atomics 开发维护。提供标准化的层次数据结构，将等离子体物理数据（平衡、剖面、源项、输运等）组织为统一的 IDS（Interface Data Structure）格式，支持不同代码和机构之间的无缝数据交换。OMAS 的核心价值在于打破代码壁垒：任何遵循 IMAS 标准写入数据的代码，其输出可被任何其他 IMAS 兼容代码直接读取，无需格式转换。OMAS 还提供丰富的 Python API 用于数据查询、切片、可视化和数据库存储（支持 HDF5、MDSplus 等后端），是国际聚变集成建模生态的数据基础设施。","features":["IMAS数据标准","层次化数据结构","跨代码互操作","Python API","HDF5/MDSplus后端"],"links":["https://github.com/gafusion/omas","https://omas.readthedocs.io/"]},"FreeGS":{"full_name":"FreeGS — Free-Boundary Grad-Shafranov Equilibrium Solver","long_desc":"FreeGS 是英国 York 大学 Ben Dudson 团队开发的轻量级 Python 自由边界 Grad-Shafranov 平衡求解器。采用有限差分法在 (R,Z) 平面求解 Grad-Shafranov 方程，支持自由边界和固定边界两种模式，可处理 PF 线圈电流约束和 X 点搜索。FreeGS 以代码简洁、易于教学和快速原型著称，是 BOUT++ 生态的平衡求解组件，常嵌入 Jupyter Notebook 中用作教学演示和控制算法原型开发。核心代码仅约 2000 行，是理解和修改最低门槛的等离子体平衡求解器之一。","features":["自由边界 GS 平衡","Python 纯实现","X 点搜索","教学/原型开发","BOUT++ 生态组件"],"links":["https://github.com/freegs-plasma/freegs"]},"FreeGSNKE":{"full_name":"FreeGSNKE — FreeGS with Newton-Krylov Evolution","long_desc":"FreeGSNKE 是 UKAEA Fusion Computing Lab 在 FreeGS 基础上扩展的自由边界 Grad-Shafranov 平衡演化求解器。核心创新是引入 Newton-Krylov 方法替代 Picard 迭代，大幅提升了非线性收敛速度和强成形等离子体的求解稳定性。专门针对 MAST-U 球形托卡马克的强成形、高拉长比等离子体场景优化，可处理电流孔（current hole）、雪花偏滤器等极端平衡位形。支持时间依赖的等离子体剖面演化和 PF 线圈电流优化，是 UKAEA 平衡控制和场景设计的核心工具。","features":["Newton-Krylov 方法","强成形等离子体","自由边界演化","MAST-U 优化","雪花偏滤器"],"links":["https://github.com/FusionComputingLab/freegsnke"]},"EFIT":{"full_name":"EFIT — Equilibrium Fitting Code","long_desc":"EFIT 是全球托卡马克等离子体平衡重建的事实标准代码，由 General Atomics 的 L.L. Lao 团队开发维护超过 30 年。通过将 Grad-Shafranov 方程解与外部磁诊断数据（磁探针、Flux loop）和内部约束（MSE、压力剖面）进行最小二乘拟合，实时重建等离子体边界、磁面和电流剖面。EFIT 已部署于 DIII-D、ITER、NSTX-U、KSTAR、EAST、JET 等全球几乎所有主要托卡马克的实时控制系统。其衍生版本包括 kinetic-EFIT（耦合动理学约束）和 CAKE（耦合输运代码），是等离子体控制的基础组件。","features":["平衡重建","磁诊断拟合","MSE 约束","实时控制","全球标准"],"links":["https://fusion.gat.com/theory/Efit"]},"SIMSOPT":{"full_name":"SIMSOPT — Stellarator Optimization Framework","long_desc":"SIMSOPT 是由 Maryland 大学 Matt Landreman 领导的 Hidden Symmetries 合作组开发的新一代仿星器优化框架。纯 Python 实现，支持多种 MHD 平衡后端（VMEC、SPEC、GVEC）、线圈设计（REGCOIL、FOCUS）和多目标优化算法。SIMSOPT 的核心理念是「优化而非设计」——通过自动微分计算磁场几何对线圈参数的梯度，直接优化三维磁场位形以满足准对称性、粒子约束和工程可行性等多重目标。成功发现了此前未知的准对称磁场位形，是仿星器复兴运动的关键代码。","features":["仿星器优化框架","多平衡后端","自动微分","准对称设计","多目标优化"],"links":["https://github.com/hiddenSymmetries/simsopt"]},"STELLOPT":{"full_name":"STELLOPT — Stellarator Optimization Suite","long_desc":"STELLOPT 是 ORNL 的 D.A. Spong 团队开发的经典仿星器优化与实验数据分析代码套件。与 VMEC 深度耦合，通过对 VMEC 输出（磁面几何、iota 剖面）进行目标函数评估，结合 Levenberg-Marquardt 和遗传算法等优化器进行磁场线圈设计。STELLOPT 在 W7-X、HSX、NCSX 和 LHD 等主流仿星器的设计优化中发挥了核心作用，其优化结果直接指导了这些装置的磁场线圈几何和等离子体位形选择。虽然较 SIMSOPT 更传统，但经过数十年验证，至今仍是仿星器社区的重要参考基准。","features":["VMEC 耦合优化","Levenberg-Marquardt","遗传算法","多目标优化","W7-X/HSX 设计"],"links":["https://github.com/ORNL-Fusion/STELLOPT"]},"REGCOIL":{"full_name":"REGCOIL — Regularized Coil Optimization Code","long_desc":"REGCOIL 是 Maryland 大学 Matt Landreman 开发的仿星器线圈电流势优化代码。核心思路是通过 Tikhonov 正则化方法，在电流势面上求解最优线圈电流分布以复现目标等离子体边界磁场，在复现精度和工程可行性之间取得平衡。REGCOIL 通常作为 SIMSOPT 线圈优化流水线的前置步骤：先通过 REGCOIL 得到连续电流势分布，再离散化为实际线圈。其正则化参数直接控制线圈间距和工程约束，是仿星器线圈工程化的关键桥梁。","features":["Tikhonov 正则化","电流势优化","线圈工程化","SIMSOPT 前置","复现精度控制"],"links":["https://github.com/landreman/regcoil"]},"FOCUS":{"full_name":"FOCUS — Flexible Optimized Coils Using Splines","long_desc":"FOCUS 是普林斯顿/PPPL 的 Caoxiang Zhu 团队开发的仿星器线圈组直接优化代码。与 REGCOIL 的两步法（先电流势后离散）不同，FOCUS 直接优化三维空间中的实际线圈曲线，采用样条函数（spline）参数化线圈路径并使用非线性梯度优化。能够处理线圈-线圈间距、曲率半径、线圈-等离子体最小距离等工程约束，适用于 W7-X、NCSX 和 CFQS 等复杂仿星器的线圈详细工程设计。2023 年后通过 GPU 加速大幅提升了大规模线圈组的优化效率。","features":["线圈直接优化","样条参数化","工程约束","GPU 加速","非线性优化"],"links":["https://github.com/PrincetonUniversity/FOCUS"]},"PROCESS":{"full_name":"PROCESS — Power Plant Systems Code","long_desc":"PROCESS 是 UKAEA 开发的聚变电厂系统级设计代码，已有 30 余年历史，是欧洲聚变电站设计（STEP、DEMO）的核心系统代码。采用 0D/1D 物理模型和工程参数化方法，在全参数空间中进行等离子体物理、超导磁体、包层/屏蔽、氚增殖、功率转换和成本经济性等多学科耦合优化。PROCESS 能够快速扫描数万种设计配置，输出满足物理和工程约束的最优电厂参数组合。近期版本集成了不确定性量化（UQ）模块和机器学习代理模型，已成为 STEP 原型电站设计迭代的核心工具。","features":["系统代码","多学科优化","0D/1D 模型","不确定性量化","STEP/DEMO 设计"],"links":["https://github.com/ukaea/PROCESS"]},"Bluemira":{"full_name":"Bluemira — Modular Fusion Reactor Design Framework","long_desc":"Bluemira 是 UKAEA 开发的模块化聚变反应堆集成设计框架，旨在统一聚变电站概念设计中的多物理、多保真度建模工作流。采用 Python 构建，以 CAD 几何引擎（FreeCAD）为中枢，将等离子体物理（PROCESS 耦合）、磁体设计、包层热工水力、中子学分析和结构力学等模块串联为可执行的设计流水线。Bluemira 的核心价值在于打破学科壁垒：不同专业团队在同一框架下协作，设计变更自动传播到下游分析。作为 STEP 原型电站的主要设计平台，Bluemira 代表了聚变电站从经验设计向系统工程的范式转变。","features":["模块化设计框架","多保真度耦合","FreeCAD 引擎","STEP 设计平台","Python 工作流"],"links":["https://bluemira.readthedocs.io/"]},"Power Balance":{"full_name":"Power Balance — Tokamak Net Power Balance Model","long_desc":"Power Balance 是 UKAEA 开发的托卡马克净功率平衡快速评估模型。基于 0D 功率流分析，计算聚变功率输出与各子系统（低温、磁体、加热/电流驱动、泵浦等）功耗之间的净功率平衡，支持对等离子体参数的敏感性分析和概念设计阶段的快速筛选。特别适用于聚变电厂早期概念设计阶段回答「这个方案能否实现净电力输出」这一核心问题。代码轻量化（纯 Python），支持交互式参数调节和 Jupyter Notebook 环境，是聚变电站概念筛选和教学演示的实用工具。","features":["0D 功率平衡","子系统功耗建模","敏感性分析","概念设计筛选","交互式 Python"],"links":["https://ukaea.github.io/powerbalance/"]},"FESTIM":{"full_name":"FESTIM — Finite Element Simulation of Tritium In Materials","long_desc":"FESTIM 是 CEA/MIT/UKAEE 联合开发的氢同位素（氘/氚）在聚变材料中输运与滞留的开源有限元模拟代码。基于 FEniCS 有限元框架，求解多陷阱、多物种氢同位素的扩散-捕获-脱附方程，支持热扩散（Soret 效应）、应力辅助扩散和表面复合/解吸边界条件。主要应用于等离子体第一壁材料（钨、铍、CFC）和包层增殖区材料的氚滞留评估、燃料循环安全分析和氚自持性预测。FESTIM 已被 ITER 组织、EUROfusion 和 UKAEA 广泛采用为氚输运标准分析工具。","features":["氢同位素输运","FEniCS 有限元","多陷阱模型","氚滞留评估","第一壁/包层"],"links":["https://festim.readthedocs.io/"]},"OpenMC":{"full_name":"OpenMC — Open Source Monte Carlo Particle Transport Code","long_desc":"OpenMC 是由 Argonne 国家实验室 Paul Romano 团队开发的新一代开源蒙特卡洛粒子输运代码，现已成为聚变中子学领域的主流开源工具。支持三维连续能量中子/光子耦合输运，具有先进的 tally 系统、CAD 几何导入（通过 DAGMC）和 MPI+OpenMP 混合并行。在聚变中，OpenMC 广泛应用于包层中子学设计（氚增殖率 TBR 计算）、屏蔽分析、核热沉积、活化计算和材料辐照损伤评估。相比传统 MCNP，OpenMC 以现代 C++/Python 架构、开源许可（MIT）和 GPU 加速路线图赢得了聚变社区尤其是私营聚变公司的青睐。","features":["蒙特卡洛中子/光子","连续能量","CAD 几何","TBR 计算","MIT 开源"],"links":["https://docs.openmc.org/"]},"DAGMC":{"full_name":"DAGMC — Direct Accelerated Geometry Monte Carlo","long_desc":"DAGMC 是由 Wisconsin 大学和 Svalinn 团队开发的 CAD 直接蒙特卡洛几何引擎，解决了传统中子学代码（MCNP）需要手动构造 CSG 几何模型的痛点。通过直接读取 CAD 模型（STEP/IGES 格式）的表面网格并使用射线追踪加速算法，DAGMC 使中子学分析可直接在工程 CAD 模型上进行。DAGMC 作为几何中间件与 OpenMC、MCNP 和 FLUKA 等多种蒙特卡洛输运代码耦合，特别适合复杂聚变装置（ITER、STEP、CFETR）的中子学分析——这些装置的 CAD 模型已极为精细，手工转换为 CSG 几何不切实际。","features":["CAD 直接几何","射线追踪加速","多代码耦合","复杂装置适配","STEP/IGES 导入"],"links":["https://svalinn.github.io/DAGMC/"]},"FISPACT-II":{"full_name":"FISPACT-II — Nuclear Activation and Transmutation Code","long_desc":"FISPACT-II 是 UKAEA 开发的世界领先核活化与嬗变计算代码，是聚变材料活化和放射性废物评估的国际标准工具。通过耦合最新的核数据库（TENDL、ENDF/B、JEFF）和详细的中子能谱输入，精确计算聚变装置中结构材料、冷却剂和包层材料在中子辐照后的活度、衰变热、剂量率、元素嬗变和放射性废物分级。FISPACT-II 是 ITER 安全分析、STEP 材料选择和 DEMO 废物管理策略制定的核心工具，其输出直接支持核监管许可申请。2024 年发布了 GPU 加速版本，显著提升了全装置活化计算的速度。","features":["核活化/嬗变","衰变热/剂量率","废物分级","ITER 安全分析","多核数据库"],"links":["https://fispact.ukaea.uk/"]},"FIDASIM":{"full_name":"FIDASIM — Fast-Ion D-Alpha Simulation Code","long_desc":"FIDASIM 是 DIII-D 的 B.A. Grierson 团队开发的快离子诊断合成模拟代码，是中性束注入（NBI）快离子分布函数诊断验证的标准工具。通过蒙特卡洛方法模拟中性束注入、电离、电荷交换和快离子轨道，合成 FIDA（快离子 D-alpha）光谱、中子发射率和中性粒子分析器（NPA）信号。FIDASIM 的核心价值在于将实验诊断信号与理论分布函数桥接——研究人员可以将任何快离子分布函数输入 FIDASIM，对比合成信号与实测信号，从而约束输运模型和高能粒子物理假设。已广泛部署于 DIII-D、NSTX-U、KSTAR、ASDEX Upgrade 和 MAST-U 等装置。","features":["快离子诊断合成","FIDA 光谱","蒙特卡洛","NBI 模拟","多装置验证"],"links":["https://d3denergetic.github.io/FIDASIM/"]},"pyrokinetics":{"full_name":"pyrokinetics — Python Interface for Gyrokinetic Microstability Analysis","long_desc":"pyrokinetics 是 UKAEA 开发的 Python 回旋动理学工作流工具包，旨在解决多回旋动理学代码（GS2、CGYRO、GENE、stella）之间输入输出格式不统一的核心痛点。提供统一的 Python 接口读取各代码的输入文件（平衡几何、动理学剖面、等离子体参数）和输出文件（增长率、本征模结构、通量），支持代码间无缝切换和基准对比。pyrokinetics 还集成了自动化的线性稳定性分析流水线（扫描 k_y 谱、参数扫描），使跨代码验证和非专家用户使用回旋动理学代码的门槛大幅降低。已成为 EUROfusion 湍流输运验证与确认工作包的核心工具。","features":["多代码格式转换","统一 Python 接口","跨代码基准对比","线性稳定性流水线","GS2/CGYRO/GENE/stella"],"links":["https://pyrokinetics.readthedocs.io/"]},"stella":{"full_name":"stella — Stellarator Gyrokinetic Turbulence Code","long_desc":"stella 是由牛津大学 Michael Barnes 和 Felix Parra 团队专门为仿星器几何开发的局域回旋动理学通量管湍流代码。与传统的托卡马克通量管代码不同，stella 天然处理仿星器三维平衡的复杂几何（非轴对称磁面和多个螺旋波纹），采用场向坐标和傅里叶谱方法直接求解五维回旋动理学方程。支持静电和电磁扰动、多粒子种和线性/非线性模拟。stella 填补了仿星器微观湍流模拟的关键空白——此前该领域过度依赖托卡马克代码的仿星器扩展，而 stella 从底层设计就针对仿星器几何优化，是 W7-X 湍流输运分析和 HSX 输运验证的标准代码。","features":["仿星器原生回旋动理学","三维平衡几何","通量管近似","线性/非线性","W7-X 标准工具"],"links":["https://github.com/stellaGK/stella"]},"DINA":{"full_name":"DINA — Nonlinear Time-Dependent Tokamak Discharge Simulator","long_desc":"DINA 是俄罗斯 Troitsk/Kurchatov 研究所开发的非线性时变托卡马克放电模拟代码，是等离子体位形控制和破裂预测领域的经典工具。耦合自由边界 Grad-Shafranov 平衡求解、等离子体剖面演化（电流、温度、密度）和 PF 线圈电路方程，可模拟从击穿、电流爬升到平顶和下降的完整放电过程。DINA 的独特优势在于对等离子体垂直位移事件（VDE）和破裂 halo 电流的精确建模，被 ITER 组织选定为破裂电磁负载评估和真空室/内部部件结构分析的核心输入代码。2023 年开源化后，被全球托卡马克社区广泛采用。","features":["自由边界 G-S 演化","完整放电模拟","VDE/halo 电流","破裂电磁负载","ITER 标准工具"],"links":["https://github.com/DINA-plasma/DINA"]},"Toksys":{"full_name":"Toksys — Tokamak System Simulator","long_desc":"Toksys 是 PPPL 开发的托卡马克等离子体控制系统模拟和设计工具。提供模块化的托卡马克等离子体/线圈/电源/控制器的集成仿真环境，支持等离子体纵向位置、电流、形状和剖面等多变量控制器的设计、调谐和验证。Toksys 的核心功能包括等离子体响应模型构建、控制矩阵计算、控制器稳定性分析和闭环仿真，广泛用于 ITER 和 NSTX-U 等离子体控制系统的设计验证。其仿真结果直接指导实际装置中控制器参数的初步设定和控制策略的可行性评估。","features":["等离子体控制系统","多变量控制","控制器设计/调谐","ITER 控制验证","闭环仿真"],"links":["https://github.com/Toksys/toksys"]},"TSC":{"full_name":"TSC — Tokamak Simulation Code","long_desc":"TSC 是普林斯顿大学/PPPL 开发的二维自由边界时变托卡马克等离子体模拟代码。在 (R,Z) 平面求解耦合的 Grad-Shafranov 平衡、表面平均输运方程和 PF 线圈电路方程，自洽模拟等离子体位形和电流剖面的时间演化。TSC 特别擅长处理等离子体大半径移动、拉长比变化和 beta 演化等宏观动力学过程，是托卡马克放电方案设计（波形开发）和等离子体控制算法预验证的经典工具。TSC 被 SPARC、ITER 和 KSTAR 等多个装置用于放电方案预研和垂直不稳定性分析。","features":["2D 自由边界","时变放电模拟","电流剖面演化","放电方案设计","垂直不稳定性"],"links":["https://github.com/PrincetonUniversity/TSC"]},"CRONOS":{"full_name":"CRONOS — Core Transport Simulator for Tokamaks","long_desc":"CRONOS 是法国 CEA 开发的综合性托卡马克芯部输运模拟套件，是欧洲聚变集成建模的核心平台之一。采用 1.5D 输运方程框架，模块化集成多种湍流输运模型（GLF23、TGLF、QualLiKiz 等准线性模型和 GENE/GYRO 第一性原理接口）、新经典输运、加热/电流驱动源项（NBI、ICRH、ECRH、LHCD）和杂质输运模块。CRONOS 在 JET、WEST、ASDEX Upgrade、JT-60SA 和 ITER 的预测模拟中广泛使用，尤其擅长模拟 H 模式台基、杂质积累和电流剖面耦合演化等复杂过程。新版本支持面向对象 Python 接口（CRONOSpy）。","features":["1.5D 芯部输运","多湍流模型集成","加热/电流驱动模块","杂质输运","JET/ITER 预测"],"links":["https://github.com/CEA-CRONOS"]},"METIS":{"full_name":"METIS — Minute Embedded Tokamak Integrated Simulator","long_desc":"METIS 是 CEA 开发的超快速托卡马克集成模拟器，专为实时控制和快速场景探索设计。采用 0D/1D/2D 混合建模策略——用 0D 全局功率平衡约束全局参数，1D 输运方程预测剖面，2D 自由边界 G-S 求解等离子体位形——在秒级内完成完整放电模拟。METIS 的核心理念是「足够快以嵌入实时控制循环」，已部署于 WEST 和 JT-60SA 的等离子体控制系统。与 TORAX 类似，METIS 代表了聚变模拟从离线物理研究向在线实时决策的范式转移，特别适用于 ITER 等装置中数千次放电的快速预演。","features":["0D/1D/2D 混合","秒级快速模拟","实时控制嵌入式","WEST/JT-60SA 部署","场景快速探索"],"links":["https://github.com/CEA-METIS"]},"ASTRA":{"full_name":"ASTRA — Automated System for TRansport Analysis","long_desc":"ASTRA 是俄罗斯 Kurchatov 研究所 CIEMAT 合作开发的经典托卡马克输运方程交互式求解系统，已有 40 年历史，是聚变输运分析的元老级代码。采用 1.5D 输运方程框架，通过用户交互式编程（ASTRA 专用脚本语言）灵活组合源项模块、输运模型和边界条件。ASTRA 以极高的灵活性和强大的图形交互界面著称，支持几乎所有主流加热/电流驱动模式、杂质辐射模型和输运模型。虽然近年逐渐被 CRONOS、OMFIT 等新一代框架取代，ASTRA 在俄罗斯（T-15MD、KTM）、欧洲和亚洲许多装置上仍活跃使用，是输运分析教学和理解等离子体自组织行为的重要工具。","features":["1.5D 输运分析","交互式脚本语言","多源项/输运模型","40 年历史验证","教学经典"],"links":["https://github.com/CIEMAT-ASTRA"]},"IPS":{"full_name":"IPS — Integrated Plasma Simulator Framework","long_desc":"IPS 是 US DOE Fusion Simulation Program（FSP）和 ORNL 联合开发的多物理耦合框架，是聚变集成建模的通用工作流引擎。采用组件化架构，通过标准化的数据交换接口使独立的等离子体物理代码（平衡、输运、加热、MHD 稳定性等）以松耦合方式协同工作。IPS 的核心创新是将代码交互建模为有向无环图（DAG）任务流，支持异步执行、事件驱动和数据依赖管理，使不同团队独立开发的代码能自动编排为完整的放电模拟流水线。IPS 被 ITER 集成建模与分析（IMAS）数据模型采用为核心架构参考。","features":["多物理耦合框架","组件化架构","任务流编排","IMAS 数据模型","异步执行"],"links":["https://ips-framework.readthedocs.io/"]},"CHEASE":{"full_name":"CHEASE — Cubic Hermite Element Axisymmetric Static Equilibrium","long_desc":"CHEASE 是 EPFL 瑞士等离子体中心开发的二维托卡马克/仿星器固定边界 MHD 平衡求解器，已有超过 30 年历史。采用 Cubic Hermite 有限元方法在磁面坐标中求解 Grad-Shafranov 方程，以高精度、高稳定性和快速收敛著称。CHEASE 的核心输出是磁面几何映射（R、Z 坐标到磁面坐标 psi 的变换），这是回旋动理学代码（GENE、GS2、CGYRO）和 MHD 稳定性代码（MISHKA/ILSA、KINX）的标准平衡输入。CHEASE 被 ITER、JET、JT-60SA 和 TCV 等多个装置的物理团队广泛使用，是欧洲聚变集成建模工具链的基础组件。","features":["Cubic Hermite 有限元","固定边界 MHD 平衡","磁面坐标映射","回旋代码标准输入","30 年验证"],"links":["https://gitlab.epfl.ch/spc/chease"]},"HELENA":{"full_name":"HELENA — Hermite Element Equilibrium Solver","long_desc":"HELENA 是由 EUROfusion 开发的固定边界托卡马克 Grad-Shafranov 平衡求解器，采用逆坐标中的 Cubic Hermite 有限元方法。与 CHEASE 密切相关但在算法细节和与 CRONOS 输运框架的耦合上有所优化：HELENA 在 (psi, theta) 磁面坐标中直接求解 G-S 方程，输出的磁面几何映射（R、Z 到 psi 的变换）是高 n 气球模稳定性代码（ELITE、MISHKA）和回旋动理学代码的标准输入。HELENA 被整合为 CRONOS 集成建模套件的首选平衡求解器，在 JET、JT-60SA 和 ITER 的输运-稳定性耦合分析中广泛使用。代码轻量化且收敛性极佳，特别适合处理强成形（高拉长比、高三角形变）的 H 模式等离子体。","features":["Cubic Hermite有限元","逆坐标G-S求解","CRONOS耦合","强成形等离子体","气球模稳定性输入"],"links":["https://pb3d.github.io/helena.html","https://gitlab.mpcdf.mpg.de/micdu/helena"]},"GVEC":{"full_name":"GVEC — Galerkin Variational Equilibrium Code","long_desc":"GVEC 是 IPP Greifswald 开发的新一代三维理想 MHD 平衡求解器，采用高精度 B 样条有限元和 Galerkin 变分方法，适用于任意三维磁约束装置（仿星器、托卡马克）。与 VMEC 不同，GVEC 不假设嵌套磁面存在，可在部分破坏磁面的区域自然求解。核心采用现代 Fortran 编写，通过 MPI+OpenMP 并行，提供 Python 包接口（pip install gvec），2025 年以论文形式发表在 Journal of Open Source Software。GVEC 被定位为 VMEC 的下一代替代方案——在计算精度、灵活性和易用性上全面升级，已被 SIMSOPT 等仿星器优化框架集成，是仿星器社区向现代化开源生态转型的关键代码。","features":["B样条Galerkin有限元","三维MHD平衡","通用磁约束几何","Python+Fortran","VMEC下一代替代"],"links":["https://github.com/gvec-group/gvec","https://gvec.readthedocs.io/"]},"MEQ":{"full_name":"MEQ — MHD Equilibrium Solver Package","long_desc":"MEQ 是 EPFL 瑞士等离子体中心开发的 MHD 平衡求解工具包，整合有限元和有限差分两种数值方法，提供从固定边界到自由边界 Grad-Shafranov 平衡的全套求解能力。MEQ 紧密嵌入 EPFL 的等离子体控制与放电方案开发工作流，主要服务于 TCV（托卡马克 à Configuration Variable）和 JT-60SA 的平衡分析。其模块化设计允许用户根据等离子体形状复杂度选择适当的求解方法——简单位形用快速有限差分，强成形/雪花偏滤器等极端位形切换到有限元模式。MEQ 的灵活架构使其成为 EPFL 快速原型开发和教学中平衡求解的首选工具。","features":["有限元/有限差分混合","自由/固定边界","TCV/JT-60SA","模块化设计","极端位形"],"links":["https://gitlab.epfl.ch/spc/public/meq"]},"LIUEQ":{"full_name":"LIUEQ — Liu Equilibrium Reconstruction Code","long_desc":"LIUEQ 是 EPFL 开发的等离子体平衡重建（equilibrium reconstruction）代码，功能类似于 EFIT。通过最小二乘拟合方法将 Grad-Shafranov 方程解与外部磁诊断数据（磁探针、Flux loop 信号）进行匹配，结合内部约束（如电子温度和密度剖面）反演等离子体边界、磁面和电流剖面。LIUEQ 特别针对 TCV 装置的独特几何（高度拉长的等离子体、快速形状变化能力）进行了优化，支持实时和离线两种模式，是 TCV 等离子体控制和物理分析的关键工具。","features":["平衡重建","磁诊断最小二乘拟合","TCV优化","实时/离线双模式","类EFIT方法"],"links":["https://www.epfl.ch/"]},"NEMO":{"full_name":"NEMO — Neutral Beam Injection Monte Carlo Birth Code for Stellarators","long_desc":"NEMO 是 IPP Greifswald 开发的仿星器中性束注入（NBI）快离子诞生蒙特卡洛代码。在三维仿星器复杂磁场几何中计算 NBI 中性粒子电离产生的快离子初始分布函数——包括电离位置、初始能量、投掷角分布和轨道类型分类。NEMO 的核心输出是快离子源项，直接输入 ASCOT5 等轨道追踪代码进行约束和损失分析。在 W7-X 的 NBI 系统设计和优化中发挥了关键作用，用于评估不同 NBI 注入角度和能量对快离子约束性能的影响。NEMO 精确处理仿星器的三维磁场波纹结构对中性束衰减和电离的影响，是仿星器高能粒子物理研究的基础工具。","features":["NBI快离子诞生","仿星器3D几何","蒙特卡洛方法","快离子源项计算","W7-X设计优化"],"links":["https://github.com/nemo-stellarator/nemo"]},"GENRAY":{"full_name":"GENRAY — General Ray Tracing Code for Electromagnetic Waves","long_desc":"GENRAY 是由 MIT/PSFC 和 General Atomics 联合开发的通用电磁波射线追踪代码。基于几何光学近似，在一般非轴对称等离子体几何中求解完整的射线追踪方程组（位置、波矢、能量），支持电子回旋波（EC）、低混杂波（LH）、离子回旋波（IC）和快波等多种色散关系。GENRAY 的通用性体现在其色散关系模块化设计：用户可选择冷等离子体、热等离子体或全动理学色散关系。输出包括波迹、功率沉积剖面和电流驱动效率，与 CQL3D Fokker-Planck 求解器直接耦合，构成 EC/LH 加热和电流驱动的标准模拟流水线。广泛应用于 DIII-D、ITER、CFETR 等装置的 RF 加热方案设计。","features":["通用射线追踪","多波段(EC/LH/IC)","非轴对称几何","CQL3D耦合","模块化色散关系"],"links":["https://compxco.com/genray.html","https://github.com/GeneralAtomics/GENRAY"]},"TORAY":{"full_name":"TORAY — Electron Cyclotron Ray Tracing Code","long_desc":"TORAY 是 General Atomics 开发的电子回旋波（EC）专用射线追踪和电流驱动计算代码。采用冷等离子体色散关系和四阶 Runge-Kutta 方法追踪 EC 波在托卡马克等离子体中的传播轨迹。相比 GENRAY 的通用性，TORAY 专精 EC 波段，提供了更精确的相对论吸收系数计算（Mazzucato 公式）和电流驱动效率评估（包括 trapped particle 效应修正）。TORAY 通常作为 CQL3D 的 EC 前端，提供波功率沉积剖面作为 Fokker-Planck 计算的输入。是 DIII-D EC 加热系统设计和实验分析的标准工具，也被 ITER EC 系统设计中广泛参考。","features":["EC专用射线追踪","Runge-Kutta方法","相对论吸收","ECCD电流驱动","CQL3D前端"],"links":["https://gafusion.github.io/OMFIT-source/"]},"CQL3D":{"full_name":"CQL3D — Collisional Quasi-Linear 3D Fokker-Planck Code","long_desc":"CQL3D 是 General Atomics 和 ORNL 联合开发的碰撞准线性三维 Fokker-Planck 求解器，是射频加热和电流驱动模拟的标准工具。在三维修正零轨道宽度速度空间（v_para, v_perp, r/a）中求解电子和离子的分布函数演化，耦合 GENRAY/TORAY 的波功率沉积，自洽计算 RF 驱动电流、吸收效率和分布函数畸变。CQL3D 支持 EC、LH、IC 和快波等多种 RF 方案，包含完整的碰撞算符（电子-电子、电子-离子）和径向扩散模型。近年来集成了三维磁场几何和 X-point 效应，可应用于边界和偏滤器区域的 RF 物理研究。是 ITER EC 和 LH 电流驱动效率预测的核心工具。","features":["Fokker-Planck求解","3D速度空间","GENRAY/TORAY耦合","RF电流驱动","ITER核心工具"],"links":["https://github.com/ORNL-Fusion/CQL3D","https://omfit.io/modules/mod_CQL3D.html"]},"AORSA":{"full_name":"AORSA — All-Orders Spectral Algorithm","long_desc":"AORSA 是 ORNL 开发的全球唯一能够保留离子回旋波（ICRF）所有有限拉莫尔半径（FLR）阶次的全波求解器。采用频域伪谱（collocation）方法在二维（R,Z）或三维几何中直接求解 Maxwell 方程组的积分-微分形式，不截断 FLR 展开，因此能精确描述 ICRF 波在高温（Ti > 10 keV）等离子体中的传播、模式转换和吸收——这是传统二阶 FLR 代码（如 TORIC）在燃烧等离子体条件下可能失效的场景。AORSA 是 ITER 燃烧等离子体 ICRF 加热方案验证的关键工具，特别是预测 ICRF 波在 α 粒子存在下的传播和吸收特性。代码在 ORNL 的超级计算机上高度并行化，支持万核级别的大规模全波模拟。","features":["全阶ICRF全波","伪谱方法","无FLR截断","燃烧等离子体","ITER关键工具"],"links":["https://github.com/ORNL-Fusion/aorsa","https://www.ornl.gov/directorate/fusion-plasma-physics"]},"TORIC":{"full_name":"TORIC — ICRF Full-Wave Code with Finite Larmor Radius","long_desc":"TORIC 是 MIT PSFC 开发的离子回旋波（ICRF）全波代码，采用谱/有限元混合方法在任意轴对称环形几何中求解 Maxwell-Vlasov 方程组。保留到二阶 FLR（有限拉莫尔半径）效应，能够描述快波和离子 Bernstein 波（IBW）的传播、模式转换和吸收。TORIC 被广泛集成到 TRANSP 输运分析代码中作为 ICRF 加热模块，是全球托卡马克 ICRF 实验分析的标准工具。其输出包括波电场、功率沉积剖面和天线耦合效率，在 JET、ASDEX Upgrade、DIII-D 和 ITER 的 ICRF 系统设计和实验解释中发挥了核心作用。最近版本通过耦合 PetraM 平台实现了机器学习辅助的参数扫描加速。","features":["二阶FLR全波","谱/有限元混合","快波-IBW模式转换","TRANSP集成","全球ICRF标准"],"links":["https://transp.jetdata.eu/"]},"NOVA":{"full_name":"NOVA/NOVA-K — Nonvariational MHD-Kinetic Stability Code","long_desc":"NOVA 是 PPPL 开发的环形等离子体 MHD 稳定性本征值代码，其动理学扩展版本 NOVA-K 是全球研究阿尔芬本征模（AE）和高能粒子驱动不稳定性最经典的工具。NOVA 在一般环形几何（托卡马克、球形托卡马克）中求解理想 MHD 本征模方程，获得环向阿尔芬本征模（TAE）、椭圆阿尔芬本征模（EAE）、鱼骨模（fishbone）和反剪切阿尔芬本征模（RSAE）等模式的本征频率和模结构。NOVA-K 通过非变分动理学-MHD 耦合方法计算高能粒子（α粒子、NBI快离子）对这些模式的激发/阻尼率。广泛用于 ITER、CFETR、SPARC 等装置的 α 粒子约束和 AE 稳定性评估，是高能粒子物理领域引用量最高的代码之一。","features":["MHD本征模求解","TAE/EAE/RSAE","动理学-MHD耦合(NOVA-K)","α粒子稳定性","ITER/CFETR标配"],"links":["https://www.osti.gov/biblio/5841622"]},"GATO":{"full_name":"GATO — Global Alfven Toroidal Stability Code","long_desc":"GATO 是由 DOE 资助开发的三维理想 MHD 线性稳定性求解器，专门用于计算托卡马克等离子体中低环向模数（low-n）的宏观不稳定性。采用有限元方法在 (psi, theta, phi) 坐标中直接求解理想 MHD 能量原理的变分形式，可处理包括外 kink 模、内 kink 模、垂直不稳定性等全局 MHD 模式的本征值和模结构。GATO 在 ITER 设计阶段被广泛用于评估等离子体位形对低 n MHD 不稳定性的鲁棒性，如验证 ITER 基线方案对外 kink 模的稳定性裕度。GATO 也常与 DCON、MARS-F 等代码互为验证基准，是 MHD 宏观稳定性分析的标准工具。","features":["低n理想MHD","有限元方法","kink模/VDE","全局稳定性","ITER设计验证"],"links":["https://github.com/GeneralAtomics/GATO"]},"ELITE":{"full_name":"ELITE — Edge Localized Instability Tokamak Experiment Code","long_desc":"ELITE 是 General Atomics 开发的专用托卡马克边界高环向模数（high-n）理想 MHD 不稳定性代码，是 peeling-ballooning 模分析的标准工具。在气球模理论的扩展框架下，采用渐近分析方法高效求解边界（pedestal）区域的高 n 剥离-气球模稳定性边界。ELITE 的核心功能是计算 pedestal 区域的不稳定性阈值，直接输出 pedestal 压强梯度（alpha）和 pedestal 电流（剥离）的稳定性空间图。ELITE 是 EPED pedestal 预测模型的核心组件（提供 peeling-ballooning 稳定性约束），广泛用于预测 H 模式 pedestal 结构、ELM 触发条件和 ELM 缓解方案的评估。","features":["high-n气球模","剥离-气球模稳定性","pedestal物理","EPED核心组件","ELM预测"],"links":["https://github.com/akcayc/ELITE","https://omfit.io/modules/mod_ELITE.html"]},"EPED":{"full_name":"EPED — Edge Pedestal Structure Prediction Model","long_desc":"EPED 是由 PPPL 的 P.B. Snyder 团队开发的全球第一个自洽 H 模式 pedestal 结构预测模型，是托卡马克 edge 物理的里程碑式成果。核心假设是 pedestal 由两个物理约束共同决定：剥离-气球模（PBM）MHD 稳定性约束（由 ELITE 计算）设定最大压强梯度，以及动理学 ballooning 模（KBM）约束设定最大归一化压强梯度 alpha_c，由此自洽确定 pedestal 高度（压强）和宽度。EPED 模型成功预测了多个装置（DIII-D、JET、ASDEX Upgrade）的 pedestal 结构，是 ITER pedestal 高度和 ELM 能量损失预测的核心工具。近年推出神经网络版本 EPED1-NN 实现超快预测，已集成到实时控制框架中。","features":["pedestal自洽预测","PBM+KBM约束","ELITE耦合","ITER/SPARC标配","EPED1-NN加速"],"links":["https://omfit.io/modules/mod_EPED.html"]},"EUROPED":{"full_name":"EUROPED — EUROfusion Pedestal Code","long_desc":"EUROPED 是 EUROfusion 在 EPED 模型基础上开发的欧洲 pedestal 建模扩展代码。保留了 EPED 核心的 peeling-ballooning + KBM 双约束框架，同时集成了欧洲装置（JET、ASDEX Upgrade、TCV、MAST-U）特有的 pedestal 物理模块——包括更精确的 bootstrap 电流计算、杂质辐射对 pedestal 的影响、三维 RMP 场对 pedestal 稳定性的修正等。EUROPED 的另一个特色是支持预测性 pedestal 演化模拟（时间依赖的 pedestal 剖面弛豫），而非仅稳态预测。作为 EUROfusion 集成建模工具链的标准 pedestal 组件，EUROPED 已被用于 ITER 和 STEP pedestal 方案的大量预测分析。","features":["EPED扩展","欧洲装置优化","杂质/RMP效应","时间依赖pedestal","ITER/STEP预测"],"links":["https://github.com/EUROfusion/EUROPED"]},"ONETWO":{"full_name":"ONETWO — 1D Transport Analysis Code","long_desc":"ONETWO 是 General Atomics 开发的经典一维输运分析代码，已有 40 余年历史，是 DIII-D 实验输运分析的标准工具。求解时间依赖的粒子、电子和离子能量输运方程，耦合 NBI（NFREYA/NUBEAM）、EC、IC 和 LH 等多种加热/电流驱动源项，以及多种新经典和湍流输运模型。ONETWO 的核心功能是「功率平衡分析」——通过匹配实验温度/密度剖面，反推各通道的有效热扩散系数，理解能量约束和输运通道。虽然近年逐渐被 TGYRO 等第一性原理代码替代部分功能，ONETWO 在实验分析、剖面解释和输运模型验证中仍然不可或缺。","features":["1D输运分析","功率平衡","多源项耦合","DIII-D标准","40年验证"],"links":["https://fusion.gat.com/THEORY/onetwo/","https://omfit.io/modules/mod_ONETWOtime.html"]},"NCLASS":{"full_name":"NCLASS — Neoclassical Transport Properties Code","long_desc":"NCLASS 是 PPPL 开发的托卡马克新经典输运性质计算代码。基于 Houlberg 等人（1997）的多粒子种新经典输运理论，在任意截面环形几何中计算新经典电阻率、bootstrap 电流、粒子扩散系数、热扩散系数和径向电场。NCLASS 被广泛嵌入 TGYRO、TRANSP、ONETWO 等输运代码中作为新经典输运模块，是分离湍流和新经典输运贡献的标准工具。代码轻量高效，输入简单（仅需平衡几何和剖面数据），是现代输运分析工作流中几乎每个放电分析都会调用的基础组件。也在 CFETR 和 BEST 等中国装置的设计中被广泛使用。","features":["新经典输运","bootstrap电流","径向电场","多粒子种","TGYRO/TRANSP组件"],"links":["https://github.com/PrincetonUniversity/NCLASS"]},"supercode":{"full_name":"SUPERCODE — Stellarator Optimization via Variational Parameter Methods","long_desc":"SUPERCODE 是 IPP Greifswald 开发的仿星器变分参数快速优化代码。采用变分原理和参数化方法，在大量简约参数空间中快速评估和优化仿星器三维磁场位形，重点关注新经典输运、α 粒子约束和 MHD 稳定性等全局物理性能指标。与 SIMSOPT/STELLOPT 的详细推导优化不同，SUPERCODE 的策略是先粗筛后细调——用快速参数扫描从海量位形空间中筛选有潜力的候选，再由高保真代码（VMEC/GVEC + ASCOT5/GENE）详细验证。SUPERCODE 的设计哲学体现了仿星器优化的典型挑战：位形空间极其巨大（数十个线圈参数），需要分层筛选策略。","features":["变分参数优化","快速位形筛选","新经典输运评估","仿星器专用","分层优化策略"],"links":["https://inis.iaea.org/"]},"BORAY":{"full_name":"BORAY — Beam-tracing O-mode Ray Code","long_desc":"BORAY 是 MIT PSFC 开发的二维电子回旋波束追踪（beam tracing）代码，区别于传统射线追踪（ray tracing）的零宽度假设，BORAY 采用更精确的束追踪方法——在追踪波束中心射线的同时，自洽求解波束宽度和波前曲率的演化方程。这使得 BORAY 能更准确地计算 EC 波的聚焦/散焦效应和功率沉积空间分布，特别适合处理 EC 波在等离子体中经历强折射和反射的复杂场景。BORAY 支持 O 模（ordinary mode）和 X 模（extraordinary mode）传播，具有开放磁面（SOL 区域）追踪能力，是 MIT/PSFC Alcator C-Mod 和 SPARC EC 加热系统设计的核心分析工具。","features":["束追踪(beam tracing)","O模/X模","开放磁面","SPARC EC设计","波束宽度演化"],"links":["https://github.com/hsxie/boray"]},"TGCO":{"full_name":"TGCO — Tokamak Geometric Coordinates & NBI Monte Carlo Code","long_desc":"TGCO 是中科院等离子体物理研究所（IPP-CAS）胡友俊团队开发的托卡马克磁面坐标计算与 NBI 蒙特卡洛模拟程序。核心功能包括两部分：一是托卡马克三维磁面坐标（psi, theta, phi）的精确计算和可视化，将 Grad-Shafranov 平衡输出转换为磁面坐标系供后续物理分析；二是中性束注入的蒙特卡洛电离和快离子初始分布计算模块，类似 NEMO 在仿星器中的角色但在托卡马克几何中实现。TGCO 以其纯 Python/C++ 混合实现和中文化文档在国内聚变学术界得到关注，特别适合教学和快速原型开发场景，降低了托卡马克几何计算和 NBI 模拟的入门门槛。","features":["磁面坐标计算","NBI蒙特卡洛","Python/C++","教学友好","IPP-CAS开发"],"links":["https://github.com/Youjunhu/TGCO"]},"HEQ":{"full_name":"HEQ — Python Free-Boundary Equilibrium Reconstruction","long_desc":"HEQ 是中科院等离子体物理研究所胡友俊团队开发的纯 Python 自由边界等离子体平衡重建代码。采用有限差分方法在 (R,Z) 平面求解自由边界 Grad-Shafranov 方程，支持 PF 线圈电流约束和磁诊断信号拟合，功能类似于 EFIT 但以代码简洁性和可读性为设计优先。HEQ 全部用 Python 编写（核心求解器使用 NumPy/SciPy），代码量仅数千行，非常适合教学、快速原型开发和算法验证。已被国内多家聚变研究机构用于平衡重建方法的教学和初步分析，其开放架构允许用户方便地替换求解器、添加新诊断约束或耦合其他物理解码。","features":["纯Python实现","自由边界平衡","磁诊断拟合","教学/原型开发","NumPy/SciPy"],"links":["https://github.com/Youjunhu/heq"]},"MARS-F":{"full_name":"MARS-F — MHD-kinetic Stability Code","long_desc":"MARS-F 是 General Atomics 开发的环形 MHD-动理学混合稳定性代码，广泛应用于高能粒子驱动的不稳定性研究。采用有限元方法求解线性 MHD 方程，通过动理学响应函数耦合高能粒子（α粒子、NBI 快离子）对 MHD 模的动理学效应。核心应用包括环形阿尔芬本征模（TAE）、高能粒子模（EPM）、鱼骨模以及电阻壁模（RWM）的稳定性评估。MARS-F 是 ITER 高能粒子物理设计中 TAE 稳定性预测和 α 粒子损失评估的标准工具之一。","features":["MHD-动理学耦合","TAE/RWM","高能粒子","有限元","ITER稳定性评估"],"links":["https://fusion.gat.com/global/theory/home"]},"UEDGE":{"full_name":"UEDGE — 2D Edge Plasma Fluid Code","long_desc":"UEDGE 是 LLNL（劳伦斯利弗莫尔国家实验室）开发的二维等离子体边界流体模拟代码，是刮削层/偏滤器物理的经典工具。采用 2D 多流体方程（电子、离子独立温度），耦合简化中性粒子模型或 DEGAS 中性蒙特卡洛代码。主要应用于偏滤器等离子体参数分布预测、杂质辐射和脱靶分析，特别在 DIII-D 装置上得到广泛验证。UEDGE 是 SOLPS-ITER 之前的边界流体模拟先行者，至今仍在 NSTX-U、DIII-D 等装置上活跃使用。","features":["2D流体","多流体模型","偏滤器模拟","中性粒子耦合","DIII-D验证"],"links":["https://github.com/LLNL/uedge"]},"EMC3-EIRENE":{"full_name":"EMC3-EIRENE — 3D Edge Monte Carlo + EIRENE Neutral Transport","long_desc":"EMC3-EIRENE 是全球唯一能够处理三维仿星器和托卡马克三维扰动场边界等离子体的模拟套件，由 IPP Greifswald 开发。EMC3 采用蒙特卡洛方法求解三维等离子体流体方程，与 EIRENE 耦合处理三维中性粒子输运。其独特之处在于不依赖环形对称性假设，能够处理仿星器自然的三维边界几何（如 W7-X 岛偏滤器）以及托卡马克中 RMP 线圈产生的三维扰动边界。EMC3-EIRENE 是 W7-X 偏滤器设计优化的唯一全三维分析工具，也在 EAST 三维边界研究中得到应用。","features":["3D蒙特卡洛","仿星器边界","EIRENE耦合","W7-X偏滤器","无轴对称假设"],"links":["https://www.ipp.mpg.de/emc3"]},"JETTO":{"full_name":"JETTO — JET Transport Code","long_desc":"JETTO 是由 JET 联合欧洲多机构开发的 1.5D 芯部等离子体输运模拟框架，是 EUROfusion 集成建模工具链的核心输运求解器之一。采用有限差分方法在磁面坐标中求解耦合的粒子、电子和离子能量输运方程以及电流扩散方程，支持扩散输运模型（Bohm/gyroBohm）和第一性原理湍流输运模型（QuaLiKiz/QLKNN、TGLF）的动态切换。JETTO 的独特优势是与 JET 实验数据的深度集成——数千次 JET 放电的验证赋予了其极高的预测可信度。与 SANCO 杂质输运模块耦合后可模拟杂质积累和辐射损失，被广泛用于 JET、JT-60SA 和 ITER 的 H 模式 scenario 开发和输运预测，是欧洲输运建模的工作马。","features":["1.5D芯部输运","多输运模型切换","JET深度验证","SANCO杂质耦合","EUROfusion核心"],"links":["https://github.com/JETTO-codes/JETTO"]},"MMM":{"full_name":"MMM — Multi-Mode Model for Anomalous Transport","long_desc":"MMM（多模式模型）是嵌入 TRANSP 集成建模框架的反常输运模型，由 Jan Weiland（查尔姆斯理工大学）原始提出，Tariq Rafiq 团队（理海大学）持续开发和验证。模型计算 ITG/TEM/ETG 等漂移波驱动的反常热输运、粒子输运、杂质输运和动量输运，包含 E×B 剪切流和 Shafranov 位移稳定化效应。2023 年完成大规模实验验证，覆盖 EAST（6 个放电）、KSTAR（17 个）、JET ILW D-D（72 个）和 DIII-D（4 个）四台装置 99 个放电场景，电子温度和离子温度的 RMS 偏差分别仅为 9.3% 和 10.5%，落在实验误差范围（~20%）以内，展现了跨装置、跨工况的高通用性和鲁棒性。与 TRANSP/NUBEAM 等代码耦合后，可用于 ITER 燃烧等离子体的预测性输运分析。","features":["反常输运模型","漂移波物理","ITG/TEM/ETG","多装置验证","TRANSP集成"],"links":["https://www6.lehigh.edu/~eus204/per/publications/journals/plasma23_MMM.pdf"]},"GLF23":{"full_name":"GLF23 — Gyro-Landau-Fluid 23-Moment Transport Model","long_desc":"GLF23 是由 J.E. Kinsey（理海大学）和 General Atomics 团队开发的漂移波驱动湍流输运模型，基于俘获回旋朗道流体（TGLF）理论框架的 23 矩封闭方法。模型自洽地预测 ITG（离子温度梯度）、TEM（俘获电子模）和 ETG（电子温度梯度模）驱动的粒子、能量和动量输运通量，包含 E×B 剪切流和 Shafranov 位移的致稳效应。GLF23 在 DIII-D 多种放电场景中成功再现芯部剖面演化，被广泛用于 ITER 预测和燃烧等离子体 scenario 研究。作为 TGLF 系列的前身和准线性输运模型的里程碑代码，GLF23 为后续 GA 标准输运模型（TGLF）奠定了物理框架和验证基准。","features":["漂移波输运","TGLF框架","ITG/TEM/ETG","E×B剪切","DIII-D验证"],"links":["https://github.com/GeneralAtomics/GLF23","https://doi.org/10.13182/FST05-A1060"]},"BgB":{"full_name":"BgB — Bohm-gyroBohm Transport Model","long_desc":"BgB（玻姆-回旋玻姆）输运模型是一种经典的半经验反常输运模型，广泛应用于托卡马克集成建模和快速放电方案设计中。模型将热输运系数分解为玻姆项（与等离子体宏观参数如密度梯度和温度梯度成比例）和回旋玻姆项（与回旋半径尺度相关），通过少数可调系数实现跨装置标度。玻姆项主导低约束模式（L 模）下的输运标度，回旋玻姆项则在 H 模 pedestal 附近占主导。BgB 模型计算效率极高，无需求解微观不稳定性本征值，适合参数扫描和反应堆概念设计阶段的大量迭代。已被纳入 TORAX（Google DeepMind）、JETTO、ASTRA 等多个输运框架，是工程设计中不可或缺的快速输运评估工具。","features":["Bohm+gyroBohm","半经验输运","快速参数扫描","TORAX/JETTO集成","跨装置标度"],"links":["https://doi.org/10.1088/1741-4326/ad6ea2","https://github.com/google-deepmind/torax"]},"MARS":{"full_name":"MARS — MHD Analysis of Resistive Spectrum","long_desc":"MARS（电阻谱 MHD 分析）是由 General Atomics 和 PPPL 合作开发的线性 MHD 稳定性本征值求解器，专门用于分析托卡马克等离子体中的电阻 MHD 不稳定性。代码在环形几何中求解全电阻 MHD 方程组的本征值问题，可计算外扭曲模（external kink）、电阻壁模（resistive wall mode, RWM）、撕裂模及新经典撕裂模的线性增长率和模结构。MARS 的一个关键特色是能够处理包含等离子体旋转和动理学效应的电阻壁模色散关系，为 ITER 等高 β 装置的不稳定性评估提供关键输入。与 MARS-F（专注于 RMP 等离子体响应）不同，MARS 专注于本征值稳定性分析，在 HL-2A 高 βN H 模放电中成功预测了 βN~3 处的外扭曲模极限。已被纳入 ITM（集成托卡马克建模）框架。","features":["线性MHD本征值","电阻MHD","RWM/扭曲模","环形几何","等离子体旋转"],"links":["https://fusion.gat.com/global/theory/home"]},"MAS":{"full_name":"MAS — Multiscale Analysis for Plasma Stabilities","long_desc":"MAS（等离子体稳定性多尺度分析）是由中国科学院物理研究所鲍健、张文禄、林志宏等团队合作开发的新一代全局本征值代码，用于分析一般托卡马克几何中从低频到高频等离子体不稳定性的谱特征。基于五场朗道流体模型，自洽地保留了抗磁漂移、离子有限拉莫尔半径、有限平行电场、离子和电子朗道共振等关键动理学效应，同时保持极高的计算效率。MAS 的朗道流体模型可在各种极限下还原为理想 MHD 模型、静电离子流体模型和漂移动理学模型，物理有效域明晰。代码已与回旋动理学和动理学-MHD 混合代码广泛基准，覆盖动理学阿尔芬波、离子声波、低 n 扭曲模、高 n ITG 模和动理学气球模。成功应用于 DIII-D #159243 放电中阿尔芬本征模（RSAE 频率扫频、TAE 隧穿阻尼）的分析。MAS 的核心优势在于将丰富物理、全局几何和高计算效率三者统一，在等离子体稳定性的线性分析领域具有广泛适用性。","features":["朗道流体模型","全局本征值","动理学效应","多模覆盖","DIII-D验证"],"links":["https://arxiv.org/abs/2304.09476","https://doi.org/10.1088/1741-4326/acd1a0"]},"IMAS":{"full_name":"IMAS — Integrated Modelling & Analysis Suite","long_desc":"IMAS 是 ITER 组织开发的聚变数据标准与集成建模基础设施，旨在统一全球聚变实验和模拟数据的描述与交换格式。核心是接口数据结构（Interface Data Structures, IDS），一套与装置无关的数据模型，覆盖平衡、输运、加热、MHD 稳定性、诊断等聚变物理全域。IMAS 于 2025 年底以开源形式发布，包含完整的 IDS 数据字典、Python 工具集（IDStools）和访问层（UAL），实现了实验数据与模拟代码之间的标准化互操作。OMFIT、OMAS 等工具已基于 IMAS 数据模型构建，JET、ITER、MAST-U 等装置正在将实验数据迁移至 IMAS 格式，使其成为聚变数据生态的枢纽基础设施。","features":["聚变数据标准","IDS数据模型","集成建模","跨装置互操作","ITER开源"],"links":["https://github.com/iterorganization/imas-data-dictionary","https://www.iter.org/node/20687/release-imas-infrastructure-and-physics-models-open-source"]},"Power Balance Models":{"full_name":"PBM — Power Balance Models for Fusion Reactor Design","long_desc":"PBM（功率平衡模型）是 UKAEA 开发的开源框架，用于评估不同托卡马克聚变反应堆设计的净功率产出。基于 Modelica 建模语言构建功率消耗（磁体、低温、加热与电流驱动、泵送等）和功率产生（聚变输出、热能转换）系统的物理模型，通过 Python API 和 CLI 接口提供快速配置和批量仿真能力。PBM 专为反应堆概念设计早期阶段设计——可在数秒至数分钟内回答该设计能否产生净电力这一核心问题。已成功应用于 STEP 原型电站的参数扫描和设计点优化中，同时支持托卡马克和仿星器两种磁约束方案。PBM 的模块化架构允许用户替换任意子系统模型，适配从概念探索到详细工程的多种保真度需求。","features":["功率平衡分析","Modelica建模","反应堆设计筛选","STEP应用","开源框架"],"links":["https://github.com/ukaea/powerbalance","https://ukaea.github.io/powerbalance/"]},"GSevolve":{"full_name":"GSevolve — Grad-Shafranov Equilibrium Evolver","long_desc":"GSevolve 是 General Atomics 和 PPPL 合作开发的托卡马克等离子体平衡演化代码，专门用于模拟自由边界等离子体位形的时变演化过程。代码自洽求解 Grad-Shafranov 平衡方程与外部线圈/被动导体的电路方程，追踪等离子体电流剖面、形状和位置的动态变化。GSevolve 已成功应用于 DIII-D 的多个复杂放电场景——包括所谓的 bobble 等离子体位形不稳定现象的复现与分析——验证了其在解释非理想等离子体行为方面的能力。与静态平衡求解器（如 EFIT）不同，GSevolve 的时间演化特性使其成为理解放电发展过程、评估竖直不稳定性以及测试反馈控制策略的重要工具。","features":["自由边界平衡","时间演化","电路耦合","DIII-D验证","位形控制"],"links":["https://github.com/PrincetonUniversity/GSevolve"]},"GSPulse":{"full_name":"GSPulse — Grad-Shafranov Pulse Trajectory Optimizer","long_desc":"GSPulse 是由 J.T. Wai（哥伦比亚大学/CFS）、M.D. Boyer、F. Felici、E. Kolemen 等联合开发的新一代托卡马克脉冲轨迹优化器，2025 年在 Nuclear Fusion 发表。与传统的放电模拟器（正问题）不同，GSPulse 解决的是反问题：给定用户设定的目标平衡位形序列以及线圈电流和电压约束，优化器自动输出实现该序列所需的电压、电流和可达平衡的完整轨迹。代码将自由边界平衡演化方程重构为优化形式，可在数分钟内同时求解数百个平衡，每个平衡同时满足 Grad-Shafranov 力平衡和轴对称电路动力学约束。已在 NSTX-U、MAST-U 实验和 SPARC 反馈控制仿真中完成验证，正被用于 SPARC 的 scenario 设计。","features":["脉冲轨迹优化","反问题求解","时间序列平衡","SPARC应用","开源"],"links":["https://github.com/jwai-cfs/GSPulse_public","https://doi.org/10.1088/1741-4326/ae203c"]},"gsfit":{"full_name":"GSFit — Grad-Shafranov Fit for Equilibrium Reconstruction","long_desc":"GSFit 是 Tokamak Energy 公司于 2025 年开源发布的现代托卡马克平衡重建工具，专为 ST40——世界磁场最高的球形托卡马克——设计。代码求解 Grad-Shafranov 方程，通过实验磁测量（ST40 配置 85 个磁传感器，包括 Mirnov 线圈和磁通环）约束重建等离子体边界、等离子体电流和储能。采用 Rust 编写核心求解器以保证速度和鲁棒性，Python 接口提供灵活性和易用性。GSFit 通过前向求解器 FreeGS 生成合成数据进行基准验证，也利用 ST40 可见光相机图像进行了独立实验验证。作为开源项目，GSFit 配备完整的用户手册、持续集成测试和开发者指南，目标是建立一个社区驱动的、可验证的聚变平衡重建生态。","features":["平衡重建","Rust+Python","磁测量约束","ST40验证","开源"],"links":["https://github.com/tokamak-energy/gsfit","https://tokamakenergy.com/2025/09/08/tokamak-energy-launches-gsfit-open-source-plasma-reconstruction-for-fusion-research/"]},"FGE":{"full_name":"FGE — Free-Boundary Grad-Shafranov Evolutive Solver","long_desc":"FGE（自由边界 Grad-Shafranov 演化求解器）是由 EPFL 瑞士等离子体中心 Cosmas Heiss、Antoine Merle、Federico Felici 等开发的高速自由边界平衡演化代码，2025 年发表于 Plasma Physics and Controlled Fusion。FGE 由 FBT 和 LIUQE 演化而来，是 MEQ 套件的一部分，共享底层优化函数。代码自洽求解自由边界 Grad-Shafranov 方程与外部导体电路方程及等离子体剖面演化模型的耦合系统，采用完全非线性 Newton 框架，支持多种高度优化的求解器选项、状态表示和残差形式。关键能力包括：集成多种 0D/1D 电流扩散方程模拟等离子体电流剖面的电阻演化，支持双磁轴位形（Doublet），以及可在给定平衡点线性化等离子体动力学以生成状态空间模型用于控制器设计。已与 RAPTOR 和 KINX 完成剖面演化和竖直增长率的基准验证。","features":["牛顿法求解","自由边界演化","双磁轴位形","控制设计","EPFL"],"links":["https://arxiv.org/abs/2512.06847","https://doi.org/10.1088/1361-6587/ae56b7"]},"DYON":{"full_name":"DYON — Plasma Burn-Through and Disruption Simulator","long_desc":"DYON 是由 JET（欧洲联合环）和 EUROfusion 团队开发的等离子体烧穿（burn-through）与破裂模拟器，自洽计算托卡马克放电起始阶段等离子体温度和密度（含杂质含量）的动态演化。代码耦合等离子体能量和粒子平衡方程与壁溅射/再循环模型，模拟从中性气体击穿到完全电离等离子体的全过程。DYON 已在 JET ITER-like Wall（ILW）条件下经受广泛验证，并被用于 ITER 放电起始阶段的烧穿预测——这是 ITER 早期运行成功的关键门槛。DYON 填补了聚变等离子体模拟中从零到等离子体这一关键空白的建模环节，对于 ITER 和未来聚变电站的可靠放电启动至关重要。","features":["等离子体烧穿","放电起始","壁溅射模型","JET验证","ITER预测"],"links":["https://doi.org/10.1088/0741-3335/55/12/124032"]},"TASK":{"full_name":"TASK — Total Analysis Suite for Tokamak Plasmas","long_desc":"TASK 是由日本京都大学福山淳（Atsushi Fukuyama）教授团队开发的托卡马克等离子体集成模拟套件，也是日本燃烧等离子体模拟计划（BPSI）的核心代码框架。TASK 采用模块化架构，包含多个独立模块——TASK/TR（输运）、TASK/WM（全波加热分析）、TASK/EQ（平衡）、TASK/FP（Fokker-Planck 动理学）等——通过标准化接口和公共数据格式实现模块间数据传递和协同仿真。代码覆盖从芯部到边界的多物理过程，支持不同保真度级别的输运模型切换，是亚洲聚变集成建模生态的重要支柱。TASK 与欧洲的 ITM/IMAS 框架保持接口兼容，用于 JT-60SA 和 ITER 的预测性模拟。","features":["集成模拟","模块化架构","全波加热","输运模型","JT-60SA"],"links":["http://bpsi.nucleng.kyoto-u.ac.jp/task/"]},"REPED":{"full_name":"REPED — Regression Pedestal Predictor","long_desc":"REPED 是 EPFL 瑞士等离子体中心开发的数据驱动 pedestal 高度预测工具，利用机器学习方法从大量实验数据库中学习 pedestal 结构的统计规律。与基于第一性原理的 EPED 模型（剥离-气球模约束）不同，REPED 采用回归模型，以工程参数（等离子体电流、环向磁场、密度、加热功率、位形等）为输入，快速预测 H 模 pedestal 的高度和宽度。REPED 的计算速度极快（毫秒级），适合集成建模中的大规模参数扫描和实时控制应用。代码封装为 Python 包，与 OMFIT 框架兼容。作为数据驱动方法的代表，REPED 补充了物理模型在 extrapolation 方面的局限性。","features":["数据驱动pedestal","回归预测","H模pedestal","EPFL","OMFIT兼容"],"links":["https://www.epfl.ch/research/domains/swiss-plasma-center/"]},"FBT":{"full_name":"FBT — Free-Boundary Tokamak Equilibrium Code","long_desc":"FBT 是由 EPFL 的 F. Hofmann 于 1988 年发表的经典自由边界托卡马克平衡代码，专为高拉长比和强成形等离子体设计。代码采用有限元方法在轴对称假设下求解 Grad-Shafranov 方程，耦合外部线圈电流和被动导体中的感应电流。FBT 是 LIUQE 和 FGE 的前身代码，其数值框架和物理模型为 EPFL 的 MEQ 平衡求解器套件奠定了基础。尽管年代久远，FBT 在 TCV（TCV 是世界上最灵活的托卡马克之一，专门研究等离子体成形）的位形设计和分析中发挥了关键作用，其基本算法思路仍然影响着现代平衡求解器的设计。","features":["自由边界平衡","有限元方法","高拉长比","TCV应用","MEQ前身"],"links":["https://doi.org/10.1016/0010-4655(88)90041-0"]},"FEEQS.M/NICE":{"full_name":"FEEQS.M/NICE — Finite Element Equilibrium Solver for Tokamaks","long_desc":"FEEQS.M 和 NICE 是 PPPL（普林斯顿等离子体物理实验室）开发的托卡马克有限元平衡求解器系列。FEEQS.M 采用自由边界有限元方法求解 Grad-Shafranov 方程，支持任意等离子体截面形状和外部导体配置，可用于实验平衡重建和理论位形分析。NICE（New Inverse Code for Equilibrium）是其变体，专注于反问题——即给定所需的等离子体边界和内部剖面，反演计算所需的线圈电流配置。两者共同构成 PPPL 平衡分析工具链的关键环节，支撑 NSTX-U、LTX-beta 等球形托卡马克和锂壁托卡马克的平衡分析。代码以 Fortran 编写，高效稳定，在 PPPL 实验中经过数十年验证。","features":["有限元平衡","自由边界","NSTX-U","反问题","PPPL"],"links":["https://www.pppl.gov/research/theory/codes"]},"JSOLVER":{"full_name":"JSOLVER — Tokamak Equilibrium J-Solver","long_desc":"JSOLVER 是 PPPL 开发的托卡马克平衡求解器，专门求解 Grad-Shafranov 方程中的环向电流密度 J 分布。代码采用固定边界或自由边界方法，在给定压强剖面和环向磁通函数的条件下，通过 Picard 迭代或 Newton 法求解非线性椭圆型偏微分方程。JSOLVER 与 PPPL 的 TRANSP、NUBEAM 等集成建模工具对接，为输运和快离子分析提供自洽的磁面几何和平衡量。代码轻量高效，适合嵌入工作流和自动化批量处理，是 PPPL 平衡工具生态中侧重电流剖面求解的专门化组件。","features":["平衡求解","环向电流","TRANSP对接","轻量高效","PPPL"],"links":["https://github.com/PrincetonUniversity/JSOLVER"]},"COTSIM":{"full_name":"COTSIM — Control-Oriented Transport Simulator","long_desc":"COTSIM（面向控制的输运模拟器）是由理海大学 Eugenio Schuster 团队开发的快速模块化托卡马克模拟代码，旨在为等离子体控制设计和场景优化提供计算高效的集成建模平台。COTSIM 耦合自由边界平衡演化求解器和输运求解器，同时追踪等离子体位形和内部剖面（温度、密度、电流）的动态演化。代码的一个关键创新是将机器学习代理模型（多层感知器、随机森林、高斯过程）嵌入仿真管线——例如用代理模型替代计算昂贵的 Lower Hybrid Current Drive（LHCD）模拟——使仿真速度提升数个数量级。2025 年在 EAST 装置上完成实验验证，证明其适用于基于模型的前馈优化和实时控制策略测试，正在向 KSTAR 和 ITER 推广。","features":["控制导向","平衡+输运耦合","ML代理模型","EAST验证","实时控制"],"links":["https://www6.lehigh.edu/~eus204/per/publications/journals/fed25a_COTSIM_ML_EAST.pdf"]},"C3PO":{"full_name":"C3PO — Coil and Configuration Code for Plasma Optimization","long_desc":"C3PO 是由德国马普等离子体物理研究所（IPP Greifswald）开发的仿星器优化设计代码，专注于三维线圈组和等离子体位形的联合优化。基于仿星器磁场由外部三维线圈产生的原理，C3PO 通过优化线圈几何（位置、形状、电流）来精确再现目标等离子体平衡的磁场结构，同时考虑工程约束（线圈间最小距离、曲率上限、支撑结构）。代码与 NEMO、GVEC、STELLOPT 等仿星器平衡和优化代码对接，形成从等离子体优化到线圈工程设计的完整工作流。C3PO 在 W7-X 偏滤器升级和下一代仿星器概念设计中发挥关键作用，代表了仿星器研究从物理优化到工程可实现性的关键桥梁。","features":["仿星器线圈优化","三维磁场","工程约束","W7-X","IPP"],"links":["https://www.ipp.mpg.de/en"]},"LUKE":{"full_name":"LUKE — Drift-Kinetic Solver for Current Drive and Fast Particles","long_desc":"LUKE（原 DKE）是 EPFL 开发的快速漂移动理学求解器，用于在任意托卡马克平衡中求解三维相对论反弹平均电子漂移动理学方程。代码专为电流驱动问题设计——包括 Lower Hybrid Current Drive（LHCD）和 Electron Cyclotron Current Drive（ECCD）——自洽计算非感应电流驱动效率和射频波驱动的电子分布函数演化。LUKE 可同时求解自举电流（bootstrap current）及其与其他电流驱动方式的协同效应，是托卡马克稳态运行方案设计的核心工具。配合 CQL3D（Fokker-Planck 求解器）和 TORAY/GENRAY（射线追踪）使用，构成射频加热与电流驱动分析的完整工具链。LUKE 采用高效数值方法，在典型放电参数下可在数秒内完成全部分布函数求解。","features":["漂移动理学","电流驱动","自举电流","EPFL","LHCD/ECCD"],"links":["https://spcgit.epfl.ch/luke/tutorial.html"]},"REMA":{"full_name":"REMA — Resistive MHD Stability Code","long_desc":"REMA 是法国原子能与替代能源委员会（CEA-IRFM）开发的电阻 MHD 稳定性分析代码，采用有限元方法在环形几何中求解全电阻 MHD 方程组的本征值问题。代码专门用于分析托卡马克中电阻性不稳定性——包括撕裂模（tearing mode）、新经典撕裂模（NTM）和电阻壁模（RWM）的线性增长率和模结构，是理解等离子体破裂前兆、评估 beta 极限和设计稳定性控制方案的重要数值工具。REMA 与 CEA 的 CRONOS、METIS 等集成建模代码对接，为 JET 和 ITER 稳态 scenario 开发提供稳定性边界。代码以 Fortran 编写，经过 WEST（钨环境稳态托卡马克）实验的验证。","features":["电阻MHD","本征值分析","撕裂模/NTM","CEA","WEST验证"],"links":["https://www.epj-conferences.org/articles/epjconf/pdf/2023/03/epjconf_ec212023_02006.pdf"]}};

/* Fusion Hub Render Engine */
let curTab='codes',curDom='all',curLic='all',curRoute='all',paperFor='';

function getDom(c){
  if(c.p.includes('湍流')||c.p.includes('回旋'))return'湍流输运';
  if(c.p.includes('MHD')&&(c.p.includes('平衡')||c.p.includes('稳定')))return'MHD平衡/稳定';
  if(c.p.includes('边界')||c.p.includes('偏滤器')||c.p.includes('SOL'))return'边界/偏滤器';
  if(c.p.includes('仿星'))return'仿星器优化';
  if(c.p.includes('集成')||c.p.includes('数据标准'))return'集成建模';
  if(c.p.includes('PIC')||c.p.includes('激光'))return'粒子模拟';
  if(c.p.includes('反应堆')||c.p.includes('系统代码'))return'反应堆工程';
  if(c.p.includes('中子')||c.p.includes('材料')||c.p.includes('活化'))return'中子学/材料';
  if(c.p.includes('诊断'))return'诊断';
  if(c.p.includes('加热'))return'加热/电流驱动';
  if(c.p.includes('控制'))return'控制/实时';
  return'其他';
}
const DOMS=['湍流输运','MHD平衡/稳定','边界/偏滤器','仿星器优化','集成建模','粒子模拟','反应堆工程','中子学/材料','加热/电流驱动','控制/实时','诊断','其他'];

function paperLink(name){
  if(!name)return'';
  // Find matching papers by code name or title keyword
  var p=P||[],count=0;
  for(var i=0;i<p.length;i++){
    var c=p[i].c||'',t=p[i].t||'';
    if(c.toLowerCase().indexOf(name.toLowerCase())>=0||t.toLowerCase().indexOf(name.toLowerCase())>=0)count++;
  }
  if(count>0)return ' · <a href="javascript:showPapers(\''+name.replace(/'/g,"\\'")+'\')" style="color:var(--ac)">📄 '+count+'篇相关论文</a>';
  return'';
}

function showPapers(name){
  paperFor=name;
  document.querySelectorAll('nav a').forEach(function(a){a.classList.remove('sel')});
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.getElementById('papers').classList.add('active');
  document.getElementById('search').value='';
  curTab='papers';
  renderPapers();
}

function setDom(d){curDom=curDom===d?'all':d;render()}
function setLic(l){curLic=curLic===l?'all':l;render()}
function setRoute(r){curRoute=curRoute===r?'all':r;render()}

function render(){
  if(curTab==='codes')renderCodes();
  else if(curTab==='devices')renderDevices();
  else if(curTab==='companies')renderCompanies();
  else if(curTab==='papers')renderPapers();
  else if(curTab==='funding')renderFunding();
  else renderNews();
}

function switchTab(t){
  paperFor='';curTab=t;curDom='all';curLic='all';curRoute='all';
  document.querySelectorAll('nav a').forEach(function(a){a.classList.remove('sel')});
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.getElementById(t).classList.add('active');
  document.getElementById('nav'+t[0].toUpperCase()+t.slice(1)).classList.add('sel');
  document.getElementById('search').value='';render();
}

function init(){renderCodes()}

function openDetail(name){
  var d=CD&&CD[name];if(!d)return;
  var c=null;for(var i=0;i<C.length;i++){if(C[i].n===name){c=C[i];break}}
  var meta='';
  if(c){
    var dom=getDom(c);var lic=c.o?'开源':'需申请';var licCls=c.o?'lo':'lc2';
    meta='<div class="d-meta"><span class="d-mtag">'+dom+'</span><span class="lc '+licCls+'">'+lic+'</span>'+(c.t||[]).slice(0,6).map(function(t){return'<span class="d-tag">'+t+'</span>'}).join('')+'</div>';
  }
  var links='';if(d.links&&d.links.length)links='<div class="d-links">'+d.links.map(function(l){var host=l.replace(/https?:\/\//,'').split('/')[0];return'<a href="'+l+'" target="_blank">'+host+'</a>'}).join(' · ')+'</div>';
  var feats='';if(d.features&&d.features.length)feats='<div class="d-features-label">核心特性</div><div class="d-features">'+d.features.map(function(f){return'<span>'+f+'</span>'}).join('')+'</div>';
  var htm='<button class="detail-close" onclick="closeDetail()">×</button><h2>'+name+'</h2><div class="d-sub">'+d.full_name+'</div>'+meta+'<div class="d-body">'+d.long_desc+'</div>'+feats+links;
  document.getElementById('detailBox').innerHTML=htm;
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function init(){renderCodes();document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail()})}


// --- Feedback ---
var fbType='错误报告';
function openFeedback(){document.getElementById('fbModal').classList.add('open');document.getElementById('fbContent').focus()}
function closeFeedback(){document.getElementById('fbModal').classList.remove('open');document.getElementById('fbMsg').style.display='none';document.getElementById('fbContent').value='';document.getElementById('fbContact').value='';updateFbSubmit()}
function selFbType(el,t){fbType=t;var s=document.querySelectorAll('#fbTypes span');for(var i=0;i<s.length;i++)s[i].classList.remove('sel');el.classList.add('sel')}
function updateFbSubmit(){document.getElementById('fbSubmit').disabled=!document.getElementById('fbContent').value.trim()}
function submitFeedback(){
  var btn=document.getElementById('fbSubmit');var msg=document.getElementById('fbMsg');
  btn.disabled=true;btn.textContent='发送中…';
  var body={
    msg_type:'interactive',
    card:{
      header:{title:{content:'🔔 Fusion Hub 反馈',tag:'plain_text'},template:'red'},
      elements:[
        {tag:'div',text:{content:'**类型:** '+fbType,tag:'lark_md'}},
        {tag:'hr'},
        {tag:'div',text:{content:document.getElementById('fbContent').value.trim(),tag:'lark_md'}},
        {tag:'hr'},
        {tag:'div',text:{content:'**页面:** '+window.location.href+'\n**时间:** '+new Date().toLocaleString('zh-CN')+(document.getElementById('fbContact').value.trim()?'\n**联系方式:** '+document.getElementById('fbContact').value.trim():''),tag:'lark_md'}}
      ]
    }
  };
  fetch('https://open.feishu.cn/open-apis/bot/v2/hook/262abe64-3f5e-4735-b434-46057b087fb1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error(r.status);msg.textContent='✅ 感谢反馈！';msg.style.display='block';btn.textContent='提交';btn.disabled=false;setTimeout(closeFeedback,2000)})
  .catch(function(e){msg.textContent='❌ 发送失败，请重试';msg.style.display='block';btn.textContent='提交';btn.disabled=false})
}

init();
</script>
<button class="fb-btn" onclick="openFeedback()" title="反馈">✎</button>

<div class="fb-types" id="fbTypes">
<span class="sel" onclick="selFbType(this,'错误报告')">错误报告</span>
<span onclick="selFbType(this,'补充信息')">补充信息</span>
<span onclick="selFbType(this,'建议')">建议</span>
</div>

<textarea id="fbContent" placeholder="请描述错误或补充信息…" oninput="updateFbSubmit()"></textarea>
<label>联系方式（选填）</label>
<input type="text" id="fbContact" placeholder="邮箱 / 飞书 / 微信"/>
<div class="fb-actions">
<button class="fb-cancel" onclick="closeFeedback()">取消</button>
<button class="fb-submit" id="fbSubmit" disabled onclick="submitFeedback()">提交</button>
</div>
<div class="fb-msg" id="fbMsg"></div>
</div>
</div>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
<div class="detail-box" id="detailBox"></div>
</div>
