<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="聚变开源代码库 — 发现、对比、获取全球聚变等离子体模拟代码与工具"/>
<title>Fusion Hub · 聚变代码库</title>
<style>
:root{
  --bg:#f8f7f4; --surface:#ffffff; --text:#1c1c1c; --muted:#5c5c5c;
  --accent:oklch(0.52 0.18 25); --accent2:oklch(0.45 0.14 24);
  --border:oklch(0.86 0.01 90); --open:#0d7a3e; --closed:#b23b1e;
  --tag-bg:oklch(0.95 0.02 90); --tag-tx:oklch(0.38 0.06 26);
  --shadow:0 1px 2px oklch(0 0 0/0.04); --shadow-h:0 8px 24px oklch(0 0 0/0.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}

/* Typography */
h1,h2{font-family:Georgia,'Times New Roman',serif;letter-spacing:-0.015em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;line-height:1.15}
h2{font-size:clamp(1.3rem,2.5vw,1.7rem);font-weight:700}
h3{font-size:1.02rem;font-weight:650}

/* Header */
header{position:sticky;top:0;z-index:100;background:oklch(1 0 0/0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:2rem;height:54px;padding:0 1.2rem}
.logo{font-family:Georgia,serif;font-size:1.2rem;font-weight:700;color:var(--accent);white-space:nowrap;text-decoration:none;letter-spacing:-0.02em}
.logo span{color:var(--muted);font-weight:400;font-size:0.8rem;margin-left:0.5em}
nav{display:flex;gap:1.2rem;flex:1}
nav a{color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:500;padding:3px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav a:hover,nav a.active{color:var(--text);border-color:var(--accent)}
.search-wrap{position:relative;flex:0 0 280px}
.search-wrap input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:0.84rem;outline:none;transition:border-color .15s,box-shadow .15s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.52 0.18 25/0.08)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;display:none;line-height:1}

/* Main */
main{max-width:1320px;margin:0 auto;padding:1.2rem 1.2rem 3rem}

/* Hero */
.hero{padding:2rem 0 1rem;text-align:center;max-width:680px;margin:0 auto}
.hero h1{margin-bottom:.4rem}
.hero p{color:var(--muted);font-size:0.95rem}
.hero .badge{display:inline-block;background:var(--accent);color:#fff;font-size:0.72rem;padding:3px 10px;border-radius:100px;font-weight:600;margin-bottom:.8rem;letter-spacing:0.03em}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:1.8rem}
.stat{text-align:center;padding:0.8rem 0.4rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.stat .n{font-family:Georgia,serif;font-size:1.6rem;font-weight:700;color:var(--accent)}
.stat .l{font-size:0.75rem;color:var(--muted);margin-top:1px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:0.8rem;margin-bottom:1.2rem;align-items:center}
.toolbar .group{display:flex;flex-wrap:wrap;gap:0.35rem}
.toolbar .lbl{font-size:0.75rem;color:var(--muted);font-weight:600;margin-right:0.3rem;align-self:center;white-space:nowrap}
.toolbar .tag{padding:0.25rem 0.6rem;border-radius:100px;font-size:0.74rem;background:var(--tag-bg);color:var(--tag-tx);cursor:pointer;border:1px solid transparent;transition:all .15s;font-weight:500;white-space:nowrap}
.toolbar .tag:hover,.toolbar .tag.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar .count{font-size:0.8rem;color:var(--muted);margin-left:auto}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0.8rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;box-shadow:var(--shadow);transition:box-shadow .15s,transform .12s;display:flex;flex-direction:column;gap:0.5rem}
.card:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.card .head{display:flex;align-items:flex-start;gap:0.6rem}
.card .icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:700;flex-shrink:0}
.icon-tok{background:oklch(0.9 0.05 25);color:oklch(0.38 0.15 26)}
.icon-stel{background:oklch(0.88 0.06 22);color:oklch(0.35 0.13 23)}
.icon-mhd{background:oklch(0.85 0.06 26);color:oklch(0.3 0.12 25)}
.icon-kinetic{background:oklch(0.82 0.08 24);color:oklch(0.28 0.14 24)}
.icon-transport{background:oklch(0.84 0.06 27);color:oklch(0.3 0.12 26)}
.icon-optim{background:oklch(0.81 0.09 23);color:oklch(0.28 0.14 23)}
.icon-sys{background:oklch(0.78 0.06 28);color:oklch(0.25 0.10 27)}
.icon-neutronics{background:oklch(0.77 0.05 29);color:oklch(0.24 0.09 28)}
.icon-diag{background:oklch(0.76 0.04 30);color:oklch(0.23 0.08 29)}
.icon-framework{background:oklch(0.73 0.03 31);color:oklch(0.22 0.06 30)}
.card .title{font-family:Georgia,serif;font-size:1rem;font-weight:700;line-height:1.2}
.card .meta{font-size:0.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:0.2rem 0.8rem}
.card .license{font-size:0.72rem;padding:1px 7px;border-radius:4px;font-weight:600}
.license-open{background:oklch(0.88 0.08 18);color:var(--open)}
.license-closed{background:oklch(0.88 0.06 16);color:var(--closed)}
.card .desc{font-size:0.82rem;color:var(--muted);line-height:1.45}
.card .tags{display:flex;flex-wrap:wrap;gap:0.25rem}
.card .tags span{font-size:0.7rem;padding:1px 6px;border-radius:100px;background:var(--tag-bg);color:var(--tag-tx)}
.card .footer{display:flex;align-items:center;gap:0.5rem;margin-top:auto;padding-top:0.4rem;border-top:1px solid var(--border)}
.card .footer a{color:var(--accent);font-size:0.78rem;text-decoration:none;font-weight:500}
.card .footer a:hover{text-decoration:underline}
.card .footer .sep{color:var(--border)}

/* Responsive */
@media(max-width:700px){
  .header-inner{flex-wrap:wrap;height:auto;padding:0.5rem 0.8rem;gap:0.6rem}
  nav{order:3;overflow-x:auto;width:100%}
  .search-wrap{flex:1;min-width:0}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{flex-direction:column;align-items:flex-start}
  .toolbar .count{margin-left:0}
}
</style>
</head>

// Icon assignment
function iconClass(p){
  const m = {
    '湍流输运':'icon-kinetic','仿星器优化':'icon-optim','仿星器':'icon-stel',
    'MHD平衡':'icon-mhd','MHD稳定性':'icon-mhd','核心输运':'icon-transport',
    '边界':'icon-tok','激光等离子体':'icon-mhd','PIC':'icon-kinetic',
    '集成建模':'icon-framework','实时控制':'icon-sys','数据标准':'icon-framework',
    '快离子':'icon-kinetic','反应堆设计':'icon-sys','系统代码':'icon-sys',
    '材料':'icon-neutronics','中子学':'icon-neutronics','诊断':'icon-diag'
  };
  for(const[k,v] of Object.entries(m)) if(p.includes(k)) return v;
  return 'icon-framework';
}

function isOpen(code){return code.open && code.url.includes('github.com') || code.url.includes('gitlab')||code.open}

// Filter state
let filterDomain='all', filterOpen='all';

// Domain categories
const domains = [
  {id:'湍流输运',label:'湍流与输运'},
  {id:'MHD',label:'MHD 平衡/稳定性'},
  {id:'边界',label:'边界与偏滤器'},
  {id:'仿星器',label:'仿星器优化/设计'},
  {id:'集成建模',label:'集成建模'},
  {id:'PIC',label:'粒子模拟 (PIC)'},
  {id:'反应堆设计',label:'反应堆工程'},
  {id:'中子学',label:'中子学与活化'},
  {id:'其他',label:'其他工具'},
];

function getDomain(code){
  const p = code.p;
  if(p.includes('湍流')||p.includes('回旋')) return '湍流输运';
  if(p.includes('MHD')) return 'MHD';
  if(p.includes('边界')||p.includes('偏滤器')||p.includes('SOL')) return '边界';
  if(p.includes('仿星器')||p.includes('stellarator')) return '仿星器';
  if(p.includes('集成建模')||p.includes('工作流')||p.includes('数据标准')) return '集成建模';
  if(p.includes('PIC')||p.includes('激光')) return 'PIC';
  if(p.includes('反应堆')||p.includes('系统代码')) return '反应堆设计';
  if(p.includes('中子')||p.includes('活化')||p.includes('材料')) return '中子学';
  return '其他';
}

function getStats(){
  const open = CODES.filter(c=>c.open).length;
  const closed = CODES.length - open;
  return {total:CODES.length,open,closed,domains:domains.length};
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const clear = document.getElementById('clearBtn');
  clear.style.display = q ? 'block':'none';
  
  const filtered = CODES.filter(c=>{
    if(filterDomain!=='all' && getDomain(c)!==filterDomain) return false;
    if(filterOpen==='open' && !c.open) return false;
    if(filterOpen==='closed' && c.open) return false;
    if(q){
      const s = (c.n+c.d+c.team+c.inst+c.p+c.tags.join(' ')).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });
  
  // Stats
  const stats = getStats();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${stats.total}</div><div class="l">收录代码</div></div>
    <div class="stat"><div class="n">${stats.open}</div><div class="l">开源</div></div>
    <div class="stat"><div class="n">${stats.closed}</div><div class="l">闭源/需申请</div></div>
    <div class="stat"><div class="n">${stats.domains}</div><div class="l">物理领域</div></div>
  `;
  
  // Toolbar tags
  const domainTags = domains.map(d=>`<span class="tag${filterDomain===d.id?' sel':''}" onclick="setDomain('${d.id}')">${d.label}</span>`).join('');
  document.getElementById('toolbar').innerHTML = `
    <span class="lbl">领域：</span>
    <div class="group">
      <span class="tag${filterDomain==='all'?' sel':''}" onclick="setDomain('all')">全部</span>
      ${domainTags}
    </div>
    <span class="lbl" style="margin-left:0.8rem">许可：</span>
    <div class="group">
      <span class="tag${filterOpen==='all'?' sel':''}" onclick="setOpen('all')">全部</span>
      <span class="tag${filterOpen==='open'?' sel':''}" onclick="setOpen('open')"><span style="color:var(--open)">⬤</span> 开源</span>
      <span class="tag${filterOpen==='closed'?' sel':''}" onclick="setOpen('closed')"><span style="color:var(--closed)">⬤</span> 闭源/需申请</span>
    </div>
    <span class="count">匹配 ${filtered.length} 个代码</span>
  `;
  
  // Grid
  document.getElementById('grid').innerHTML = filtered.map(c=>`
    <div class="card">
      <div class="head">
        <div class="icon ${iconClass(c.p)}">${c.n[0]}</div>
        <div>
          <div class="title">${c.n}</div>
          <div class="meta">${c.p}</div>
        </div>
        <span class="license ${c.open?'license-open':'license-closed'}" style="margin-left:auto">${c.open?'开源':'需申请'}</span>
      </div>
      <div class="desc">${c.d}</div>
      <div class="tags">${c.tags.slice(0,4).map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="footer">
        <span style="font-size:0.76rem;color:var(--muted)">👤 ${c.team} · 🏛 ${c.inst}</span>
        <span class="sep" style="margin-left:auto"></span>
        <a href="${c.url}" target="_blank" rel="noopener">${c.open?'GitHub / 主页 →':'访问主页 →'}</a>
      </div>
    </div>
  `).join('')||'<div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1">没有匹配的代码，试试调整筛选条件</div>';
}

function setDomain(d){filterDomain=filterDomain===d?'all':d;render()}
function setOpen(o){filterOpen=filterOpen===o?'all':o;render()}
function clearSearch(){document.getElementById('search').value='';render()}

// Init
render();
</script>
